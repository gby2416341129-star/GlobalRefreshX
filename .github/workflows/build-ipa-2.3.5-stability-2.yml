name: Build Speed 2.3.5 Stability 2 IPA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa-2.3.5-stability-2.yml'
      - 'patches/speed-2.3.5-stability-2.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASELINE_SOURCE: Speed-2.3.4-Stability-1-Source.tar.gz
  PATCH_FILE: patches/speed-2.3.5-stability-2.patch.gz.b64

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Speed 2.3.4 Stability 1 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/source"
          gh release download dev-latest \
            --pattern "$BASELINE_SOURCE" \
            --dir "$GITHUB_WORKSPACE/baseline"
          tar -xzf "$GITHUB_WORKSPACE/baseline/$BASELINE_SOURCE" \
            -C "$GITHUB_WORKSPACE/source"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Apply Stability 2 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$GITHUB_WORKSPACE/$PATCH_FILE" | gunzip > "$RUNNER_TEMP/speed-2.3.5.patch"
          cd "$PROJECT_ROOT"
          patch --dry-run -p1 < "$RUNNER_TEMP/speed-2.3.5.patch"
          patch -p1 < "$RUNNER_TEMP/speed-2.3.5.patch"

          # Never inherit DerivedData / prior package outputs from a source archive.
          rm -rf "$PROJECT_ROOT/build" "$PROJECT_ROOT/dist"

          grep -q 'MARKETING_VERSION = 2.3.5' "$PROJECT_ROOT/pip_swift/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'CURRENT_PROJECT_VERSION = 2026090910' "$PROJECT_ROOT/pip_swift/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'cancelPendingPlayerLayerMediaWork' "$PROJECT_ROOT/pip_swift/pip_swift/ViewController.swift"
          grep -q 'optionalMinimumPrewarmDelay' "$PROJECT_ROOT/pip_swift/pip_swift/ViewController.swift"
          grep -q 'purgeManagedVideos = isRuleChanged' "$PROJECT_ROOT/pip_swift/pip_swift/DiagnosticsResetManager.swift"
          grep -q 'synchronousLayout: false' "$PROJECT_ROOT/pip_swift/pip_swift/ViewController.swift"

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Verify project
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Package clean outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-2.3.5-Stability-2-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.3.5-Stability-2-Source.tar.gz"

          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          unzip -t "$ipa"
          shasum -a 256 "$ipa" > "$ipa.sha256"

          # Source package intentionally excludes transient build products.
          tar \
            --exclude='./build' \
            --exclude='./dist' \
            -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-2.3.5-Stability-2
          path: |
            out/Speed-2.3.5-Stability-2-unsigned.ipa
            out/Speed-2.3.5-Stability-2-unsigned.ipa.sha256
            out/Speed-2.3.5-Stability-2-Source.tar.gz
            out/Speed-2.3.5-Stability-2-Source.tar.gz.sha256
          if-no-files-found: error

      - name: Publish rolling prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-2.3.5-Stability-2-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.3.5-Stability-2-Source.tar.gz"

          gh release upload dev-latest "$ipa" "$src" --clobber
          gh release edit dev-latest \
            --target "$GITHUB_SHA" \
            --title "Speed 2.3.5 Stability 2" \
            --notes "Stability/performance cleanup only; no new features and no UI redesign. Standard 120Hz CADisplayLink behavior is retained. Ordinary app updates preserve valid generated compatibility media, optional 1pt compatibility prewarm is delayed, obsolete compatibility encodes are cancelled when leaving the route, interrupted PiP height animations converge geometry safely, Standard height-slider preview avoids per-event root layout, and redundant route-switch SwiftUI refresh is removed. Unsigned IPA: sign before installation." \
            --prerelease
