name: Build Speed 2.6.4 Side Stash + PiP Conflict

on:
  push:
    branches: [speed-2.6-dev]
    paths:
      - '.github/workflows/build-ipa-2.6.4-side-stash-pip-conflict.yml'
      - 'scripts/speed264/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASELINE_SOURCE: Speed-2.6.3-Core-Logic-Cleanup-Source.tar.gz

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out Speed 2.6 development
        uses: actions/checkout@v4
        with:
          ref: speed-2.6-dev

      - name: Download Speed 2.6.3 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/source"
          gh release download dev-latest --pattern "$BASELINE_SOURCE" --dir "$GITHUB_WORKSPACE/baseline"
          tar -xzf "$GITHUB_WORKSPACE/baseline/$BASELINE_SOURCE" -C "$GITHUB_WORKSPACE/source"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Apply Speed 2.6.4 side-stash and PiP-conflict patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          for patch_file in \
            "$GITHUB_WORKSPACE/scripts/speed264/HomePresentationState.patch" \
            "$GITHUB_WORKSPACE/scripts/speed264/KeepAliveLogger.patch" \
            "$GITHUB_WORKSPACE/scripts/speed264/PiPViews.patch" \
            "$GITHUB_WORKSPACE/scripts/speed264/ViewController-1.patch" \
            "$GITHUB_WORKSPACE/scripts/speed264/ViewController-2.patch" \
            "$GITHUB_WORKSPACE/scripts/speed264/ViewController-3.patch" \
            "$GITHUB_WORKSPACE/scripts/speed264/project.pbxproj.patch" \
            "$GITHUB_WORKSPACE/scripts/speed264/verify_project.patch"
          do
            echo "Applying $patch_file"
            patch --batch -p4 < "$patch_file"
          done
          rm -rf "$PROJECT_ROOT/build" "$PROJECT_ROOT/dist"

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Verify integration
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Require warning-clean Swift build
        shell: bash
        run: |
          set -euo pipefail
          log="$PROJECT_ROOT/build/diagnostics/xcodebuild.log"
          test -f "$log"
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' "$log"; then
            echo 'Swift warnings are not allowed in Speed 2.6.4.' >&2
            exit 1
          fi

      - name: Validate and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-2.6.4-Side-Stash-PiP-Conflict-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.6.4-Side-Stash-PiP-Conflict-Source.tar.gz"
          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          unzip -t "$ipa"
          unzip -l "$ipa" | grep -q 'Payload/Speed.app/PlugIns/SpeedControls.appex/SpeedControls$'
          raw_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.mov$' | wc -l | tr -d ' ')"
          compact_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.spm$' | wc -l | tr -d ' ')"
          test "$raw_count" -eq 3
          test "$compact_count" -eq 217
          python3 -c "import plistlib,zipfile; z=zipfile.ZipFile('$ipa'); a=plistlib.loads(z.read('Payload/Speed.app/Info.plist')); e=plistlib.loads(z.read('Payload/Speed.app/PlugIns/SpeedControls.appex/Info.plist')); assert a['CFBundleShortVersionString']=='2.6.4' and a['CFBundleVersion']=='2026091008'; assert e['CFBundleShortVersionString']=='2.6.4' and e['CFBundleVersion']=='2026091008'; print('Validated Speed 2.6.4 app + extension')"
          shasum -a 256 "$ipa" > "$ipa.sha256"
          tar --exclude='./build' --exclude='./dist' -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-2.6.4-Side-Stash-PiP-Conflict
          path: |
            out/Speed-2.6.4-Side-Stash-PiP-Conflict-unsigned.ipa
            out/Speed-2.6.4-Side-Stash-PiP-Conflict-unsigned.ipa.sha256
            out/Speed-2.6.4-Side-Stash-PiP-Conflict-Source.tar.gz
            out/Speed-2.6.4-Side-Stash-PiP-Conflict-Source.tar.gz.sha256
          if-no-files-found: error

      - name: Publish Speed 2.6.4 test assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-2.6.4-Side-Stash-PiP-Conflict-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.6.4-Side-Stash-PiP-Conflict-Source.tar.gz"
          gh release upload dev-latest "$ipa" "$src" --clobber
          gh release edit dev-latest \
            --target "$GITHUB_SHA" \
            --title 'Speed 2.6.4 Side Stash + PiP Conflict' \
            --notes 'Experimental side-stash build. Adds first-use native side-stash calibration for one-tap hide, remembers the last left/right stash position and vertical placement, and replays that saved placement on later one-tap hides instead of reverting to the 0.1/1pt pseudo-hide path. Adds persistent pause reasons and local notifications when another Picture in Picture session suspends, occupies, or replaces Speed PiP; the home screen clearly shows 120Hz paused for a detected PiP conflict and Speed paused for an unexpected stop, with recovery guidance. Preserves the 2.6.3 core cleanup, stable CADisplayLink path, and compact 3 MOV + 217 SPM compatibility media.' \
            --prerelease
