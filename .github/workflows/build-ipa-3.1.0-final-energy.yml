name: Build Speed 3.1.0 Final Energy Architecture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa-3.1.0-final-energy.yml'
      - 'patches/speed310-final-energy.part*'
      - 'patches/speed310-final-energy-fix1.patch'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Speed 3.0.11 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/source"
          gh release download dev-latest --pattern 'Speed-3.0.11-Energy-Core-Source.tar.gz' --dir "$GITHUB_WORKSPACE/baseline"
          baseline="$GITHUB_WORKSPACE/baseline/Speed-3.0.11-Energy-Core-Source.tar.gz"
          test -f "$baseline"
          tar -xzf "$baseline" -C "$GITHUB_WORKSPACE/source"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Reassemble and apply Speed 3.1.0 patch
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/patches/speed310-final-energy.part{00,01,02,03,04,05,06,07,08} > "$RUNNER_TEMP/speed310.b64"
          base64 -D < "$RUNNER_TEMP/speed310.b64" | gunzip > "$RUNNER_TEMP/speed310.patch"
          actual="$(shasum -a 256 "$RUNNER_TEMP/speed310.patch" | awk '{print $1}')"
          expected="17998e3f4cd86d2db23245a64b875267c3b65ecc9e05ef6ee709c5d81b920ac5"
          echo "patch sha256=$actual"
          test "$actual" = "$expected"
          cd "$PROJECT_ROOT"
          patch --dry-run -p1 < "$RUNNER_TEMP/speed310.patch"
          patch -p1 < "$RUNNER_TEMP/speed310.patch"
          patch --dry-run -p1 < "$GITHUB_WORKSPACE/patches/speed310-final-energy-fix1.patch"
          patch -p1 < "$GITHUB_WORKSPACE/patches/speed310-final-energy-fix1.patch"
          rm -rf build dist

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Parse modified Swift sources
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse "$PROJECT_ROOT/pip_swift/pip_swift/AppDebugLogger.swift"
          swiftc -frontend -parse "$PROJECT_ROOT/pip_swift/pip_swift/RefreshRateController.swift"
          swiftc -frontend -parse "$PROJECT_ROOT/pip_swift/pip_swift/ViewController.swift"
          swiftc -frontend -parse "$PROJECT_ROOT/pip_swift/pip_swift/PiPViews.swift"

      - name: Execute core regressions
        shell: bash
        run: "$PROJECT_ROOT/scripts/test_core.sh"

      - name: Verify integrated project
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Require warning-clean Swift compilation
        shell: bash
        run: |
          set -euo pipefail
          log="$PROJECT_ROOT/build/diagnostics/xcodebuild.log"
          test -f "$log"
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' "$log"; then
            echo 'Swift source warnings are not allowed in Speed 3.1.0.' >&2
            exit 1
          fi

      - name: Validate actual Speed 3.1.0 IPA
        shell: bash
        run: python3 "$PROJECT_ROOT/scripts/validate_ipa.py" "$PROJECT_ROOT/dist/Speed-unsigned.ipa"

      - name: Verify packaged version and architecture markers
        shell: bash
        run: |
          set -euo pipefail
          app_plist="$PROJECT_ROOT/build/Payload/Speed.app/Info.plist"
          test -f "$app_plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_plist")" = "3.1.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_plist")" = "2026091209"
          grep -q 'energyProbe' "$PROJECT_ROOT/pip_swift/pip_swift/AppDebugLogger.swift"
          grep -q 'backgroundCompositorAnchor' "$PROJECT_ROOT/pip_swift/pip_swift/RefreshRateController.swift"
          grep -q '1fps-60s-energy-v1.mov' "$PROJECT_ROOT/pip_swift/pip_swift/ViewController.swift"

      - name: Package release outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-3.1.0-Final-Energy-Architecture-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-3.1.0-Final-Energy-Architecture-Source.tar.gz"
          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          shasum -a 256 "$ipa" > "$ipa.sha256"
          tar --exclude='./build' --exclude='./dist' -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-3.1.0-Final-Energy-Architecture
          path: |
            out/Speed-3.1.0-Final-Energy-Architecture-unsigned.ipa
            out/Speed-3.1.0-Final-Energy-Architecture-unsigned.ipa.sha256
            out/Speed-3.1.0-Final-Energy-Architecture-Source.tar.gz
            out/Speed-3.1.0-Final-Energy-Architecture-Source.tar.gz.sha256
            source/build/diagnostics/xcodebuild.log
          if-no-files-found: error

      - name: Publish rolling prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-3.1.0-Final-Energy-Architecture-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-3.1.0-Final-Energy-Architecture-Source.tar.gz"
          gh release upload dev-latest "$ipa" "$src" --clobber
          gh release edit dev-latest --target "$GITHUB_SHA" --title "Speed 3.1.0 Final Energy Architecture" --notes "Data-guided energy architecture release. Default proven CAD routes remain intact. Adds low-overhead Energy Probe vs Full recorder, time-weighted CPU/context-switch/page-fault telemetry, cached Metal telemetry, sparse 1fps PlayerLayer media with automatic legacy fallback, and an opt-in CAAnimation low-wakeup anchor experiment with immediate fallback to the proven CAD path." --prerelease
