name: Build Speed 2.3.3 Laboratory 4 IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  BASELINE_SOURCE: Speed-2.3.2-Laboratory-3-Source.tar.gz

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Speed 2.3.2 Laboratory 3 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/source"
          gh release download dev-latest \
            --pattern "$BASELINE_SOURCE" \
            --dir "$GITHUB_WORKSPACE/baseline"
          tar -xzf "$GITHUB_WORKSPACE/baseline/$BASELINE_SOURCE" \
            -C "$GITHUB_WORKSPACE/source"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Apply Laboratory status synchronization fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_ROOT" <<'PYFIX'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])

          pip_views = root / "pip_swift/pip_swift/PiPViews.swift"
          s = pip_views.read_text()
          old = '''                        Text(latencyExperimentState.updateLinkActive
                               ? L10n.text("运行中", "Active")
                               : L10n.text("未启用", "Off"))
                              .font(.caption.weight(.semibold))
                              .foregroundStyle(latencyExperimentState.updateLinkActive ? Color.green : Color.secondary)'''
          new = '''                        Text((latencyExperimentState.anyPreferenceEnabled && latencyExperimentState.updateLinkActive)
                               ? L10n.text("运行中", "Active")
                               : L10n.text("未启用", "Off"))
                              .font(.caption.weight(.semibold))
                              .foregroundStyle((latencyExperimentState.anyPreferenceEnabled && latencyExperimentState.updateLinkActive)
                                               ? Color.green
                                               : Color.secondary)'''
          if old not in s:
              raise RuntimeError("PiPViews Laboratory status block not found")
          pip_views.write_text(s.replace(old, new))

          vc = root / "pip_swift/pip_swift/ViewController.swift"
          s = vc.read_text()
          old = '''    private func setLatencyExperimentAll(_ enabled: Bool) {
              LatencyExperimentController.shared.setAllEnabled(enabled)
              updateHomeView(animated: true)
          }

          private func setLowLatencyEventDispatch(_ enabled: Bool) {
              LatencyExperimentController.shared.setLowLatencyEventDispatchEnabled(enabled)
              updateHomeView(animated: true)
          }

          private func setImmediatePresentation(_ enabled: Bool) {
              LatencyExperimentController.shared.setImmediatePresentationEnabled(enabled)
              updateHomeView(animated: true)
          }

          private func setContinuousUpdates(_ enabled: Bool) {
              LatencyExperimentController.shared.setContinuousUpdatesEnabled(enabled)
              updateHomeView(animated: true)
          }'''
          new = '''    private func refreshLatencyExperimentUIAfterMutation() {
              // UIUpdateLink rebuilds are intentionally deferred to the next main-queue turn.
              // Refresh once immediately for switch responsiveness, then once after the
              // controller's queued rebuild so the status badge never shows the prior state.
              updateHomeView(animated: true)
              DispatchQueue.main.async { [weak self] in
                  self?.updateHomeView(animated: false)
              }
          }

          private func setLatencyExperimentAll(_ enabled: Bool) {
              LatencyExperimentController.shared.setAllEnabled(enabled)
              refreshLatencyExperimentUIAfterMutation()
          }

          private func setLowLatencyEventDispatch(_ enabled: Bool) {
              LatencyExperimentController.shared.setLowLatencyEventDispatchEnabled(enabled)
              refreshLatencyExperimentUIAfterMutation()
          }

          private func setImmediatePresentation(_ enabled: Bool) {
              LatencyExperimentController.shared.setImmediatePresentationEnabled(enabled)
              refreshLatencyExperimentUIAfterMutation()
          }

          private func setContinuousUpdates(_ enabled: Bool) {
              LatencyExperimentController.shared.setContinuousUpdatesEnabled(enabled)
              refreshLatencyExperimentUIAfterMutation()
          }'''
          if old not in s:
              raise RuntimeError("ViewController Laboratory mutation block not found")
          vc.write_text(s.replace(old, new))

          project = root / "pip_swift/pip_swift.xcodeproj/project.pbxproj"
          p = project.read_text()
          if "MARKETING_VERSION = 2.3.2;" not in p:
              raise RuntimeError("2.3.2 project version not found")
          p = p.replace("MARKETING_VERSION = 2.3.2;", "MARKETING_VERSION = 2.3.3;")
          p = p.replace("CURRENT_PROJECT_VERSION = 2026090907;", "CURRENT_PROJECT_VERSION = 2026090908;")
          project.write_text(p)

          verify = root / "scripts/verify_project.sh"
          v = verify.read_text()
          v = v.replace("Speed version 2.3.2", "Speed version 2.3.3")
          v = v.replace("MARKETING_VERSION = 2.3.2", "MARKETING_VERSION = 2.3.3")
          v = v.replace("CURRENT_PROJECT_VERSION = 2026090907", "CURRENT_PROJECT_VERSION = 2026090908")
          verify.write_text(v)
          PYFIX

          chmod +x "$PROJECT_ROOT/scripts/"*.sh
          grep -q 'MARKETING_VERSION = 2.3.3' "$PROJECT_ROOT/pip_swift/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'CURRENT_PROJECT_VERSION = 2026090908' "$PROJECT_ROOT/pip_swift/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'latencyExperimentState.anyPreferenceEnabled && latencyExperimentState.updateLinkActive' "$PROJECT_ROOT/pip_swift/pip_swift/PiPViews.swift"
          grep -q 'refreshLatencyExperimentUIAfterMutation' "$PROJECT_ROOT/pip_swift/pip_swift/ViewController.swift"

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Verify project
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-2.3.3-Laboratory-4-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.3.3-Laboratory-4-Source.tar.gz"
          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          unzip -t "$ipa"
          shasum -a 256 "$ipa" > "$ipa.sha256"
          tar -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-2.3.3-Laboratory-4
          path: |
            out/Speed-2.3.3-Laboratory-4-unsigned.ipa
            out/Speed-2.3.3-Laboratory-4-unsigned.ipa.sha256
            out/Speed-2.3.3-Laboratory-4-Source.tar.gz
            out/Speed-2.3.3-Laboratory-4-Source.tar.gz.sha256
          if-no-files-found: error

      - name: Publish rolling prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload dev-latest \
            "$GITHUB_WORKSPACE/out/Speed-2.3.3-Laboratory-4-unsigned.ipa" \
            "$GITHUB_WORKSPACE/out/Speed-2.3.3-Laboratory-4-Source.tar.gz" \
            --clobber
