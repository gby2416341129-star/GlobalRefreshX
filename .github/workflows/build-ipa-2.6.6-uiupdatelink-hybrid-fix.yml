name: Build Speed 2.6.7 Lab Crash Recovery

on:
  push:
    branches: [speed-2.6-dev]
    paths:
      - '.github/workflows/build-ipa-2.6.6-uiupdatelink-hybrid-fix.yml'
      - 'scripts/speed266/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASELINE_SOURCE: Speed-2.6.5-One-Tap-Hide-Fix-Source.tar.gz
  PATCH_SHA256: b99f9751fdb211201911d451d51a5a3f3c1334bdc56c7d8b6d9aea26362a5bc1

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out Speed 2.6 development
        uses: actions/checkout@v4
        with:
          ref: speed-2.6-dev

      - name: Download Speed 2.6.5 last-known-good source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/source"
          gh release download dev-latest --pattern "$BASELINE_SOURCE" --dir "$GITHUB_WORKSPACE/baseline"
          tar -xzf "$GITHUB_WORKSPACE/baseline/$BASELINE_SOURCE" -C "$GITHUB_WORKSPACE/source"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Apply Speed 2.6.7 Lab crash recovery
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/scripts/speed266/part*.b64 | base64 -D | gunzip > "$RUNNER_TEMP/speed267.patch"
          actual="$(shasum -a 256 "$RUNNER_TEMP/speed267.patch" | awk '{print $1}')"
          test "$actual" = "$PATCH_SHA256"
          cd "$PROJECT_ROOT"
          patch -p1 < "$RUNNER_TEMP/speed267.patch"
          rm -rf "$PROJECT_ROOT/build" "$PROJECT_ROOT/dist"

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Verify integration
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Require warning-clean Swift build
        shell: bash
        run: |
          set -euo pipefail
          log="$PROJECT_ROOT/build/diagnostics/xcodebuild.log"
          test -f "$log"
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' "$log"; then
            echo 'Swift warnings are not allowed in Speed 2.6.7.' >&2
            exit 1
          fi

      - name: Validate and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-2.6.7-Lab-Crash-Recovery-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.6.7-Lab-Crash-Recovery-Source.tar.gz"
          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          unzip -t "$ipa"
          unzip -l "$ipa" | grep -q 'Payload/Speed.app/PlugIns/SpeedControls.appex/SpeedControls$'
          raw_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.mov$' | wc -l | tr -d ' ')"
          compact_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.spm$' | wc -l | tr -d ' ')"
          test "$raw_count" -eq 3
          test "$compact_count" -eq 217
          python3 -c "import plistlib,zipfile; z=zipfile.ZipFile('$ipa'); a=plistlib.loads(z.read('Payload/Speed.app/Info.plist')); e=plistlib.loads(z.read('Payload/Speed.app/PlugIns/SpeedControls.appex/Info.plist')); assert a['CFBundleShortVersionString']=='2.6.7' and a['CFBundleVersion']=='2026091103'; assert e['CFBundleShortVersionString']=='2.6.7' and e['CFBundleVersion']=='2026091103'; print('Validated Speed 2.6.7 app + extension')"
          shasum -a 256 "$ipa" > "$ipa.sha256"
          tar --exclude='./build' --exclude='./dist' -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-2.6.7-Lab-Crash-Recovery
          path: |
            out/Speed-2.6.7-Lab-Crash-Recovery-unsigned.ipa
            out/Speed-2.6.7-Lab-Crash-Recovery-unsigned.ipa.sha256
            out/Speed-2.6.7-Lab-Crash-Recovery-Source.tar.gz
            out/Speed-2.6.7-Lab-Crash-Recovery-Source.tar.gz.sha256
          if-no-files-found: error

      - name: Publish Speed 2.6.7 test assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-2.6.7-Lab-Crash-Recovery-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.6.7-Lab-Crash-Recovery-Source.tar.gz"
          gh release upload dev-latest "$ipa" "$src" --clobber
          gh release edit dev-latest \
            --target "$GITHUB_SHA" \
            --title 'Speed 2.6.7 Lab Crash Recovery' \
            --notes 'Reverts the 2.6.6 shared WindowScene UIUpdateLink architecture that caused every Laboratory control to enter the same crash path. 2.6.7 rebuilds from the 2.6.5 last-known-good base, restores all Lab controls, uses one visible-view-bound UIUpdateLink with an action handler, applies the complete Lab state atomically once per user mutation, never mutates an enabled UIUpdateLink in place, keeps experimental state session-only, and falls back to the stable CADisplayLink when the scene is not foreground-active or the Governor blocks continuous UI updates. Preserves all 2.6.5 one-tap hide fixes, PiP-conflict notifications, and compact 3 MOV + 217 SPM compatibility media.' \
            --prerelease
