name: Kuka CSharp UI 1.2.0 Windows Verify

on:
  workflow_dispatch:
  push:
    branches:
      - kuka-ui-110
    paths:
      - 'kuka-ci/**'
      - 'kuka-ui/**'
      - '.github/workflows/kuka-csharp-ci.yml'

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated UI branch
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Reconstruct verified 1.0.6 source archive
        shell: pwsh
        run: |
          $chunkInfo = @(
            @{ Path='kuka-ci/parts/part-00.txt'; Hash='cbeb917a1b42f6706fd4ac934681c34527a6bec84de2035c27365eeee8dbaa2d' },
            @{ Path='kuka-ci/parts/part-01.txt'; Hash='7f4d5e46183e9104da87f2554b8dcb09b0a75c7a2a682d18d2a696e62441e2a2' },
            @{ Path='kuka-ci/parts/p2-0.txt'; Hash='00e17ff8a538c8e0040ef3d822c2fd344b0e4e7cbc7ce59c9fa186957206f430' },
            @{ Path='kuka-ci/parts/p2-1.txt'; Hash='a75345d829ee56f831a657e450b0187f8135a3d061a301d5ffcf0a1731dfac65' },
            @{ Path='kuka-ci/parts/p2-2.txt'; Hash='38db8298eda6e74ae240496fff63c8924831f8b90d089d965ec2cf3e7b80682f' },
            @{ Path='kuka-ci/parts/p2-3.txt'; Hash='65980abc047124ed16ed9dd80ec996d4763aec381a5ec0955458e2dd32ef16a6' },
            @{ Path='kuka-ci/parts/part-03.txt'; Hash='30cd50942f029f256276a182d71f922c46fb67d91f2ab4b3c0d81daf3b877c15' },
            @{ Path='kuka-ci/parts/part-04.txt'; Hash='40762de1bf88dbf7cf053f2331955c1fe38229cccfdb3723b487112e9b1d22f2' }
          )
          $parts = @()
          foreach ($chunk in $chunkInfo) {
            if (-not (Test-Path $chunk.Path)) { throw "Missing $($chunk.Path)" }
            $actual = (Get-FileHash $chunk.Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $chunk.Hash) { throw "Chunk checksum mismatch: $($chunk.Path) => $actual" }
            $parts += (Get-Content $chunk.Path -Raw -Encoding ASCII).Trim()
          }
          $b64 = ($parts -join '')
          if ($b64.Length -ne 63168) { throw "Unexpected base64 length: $($b64.Length)" }
          [IO.File]::WriteAllText('source.b64', $b64, [Text.Encoding]::ASCII)
          if ((Get-FileHash source.b64 -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7e406b7bddabd6aa206cf151e3313af67e2d33baf1bc9cc25509c71f45cb5039') { throw 'Base64 checksum mismatch' }
          [IO.File]::WriteAllBytes('source.tar.xz', [Convert]::FromBase64String($b64))
          if ((Get-FileHash source.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant() -ne '796cf89de00eb700817a0aa16e38b5c31955218ca857fd7b27f84bd1a4fae12d') { throw 'Archive checksum mismatch' }
          tar -xf source.tar.xz
          if ($LASTEXITCODE -ne 0) { throw "tar extraction failed: $LASTEXITCODE" }
          if (-not (Test-Path 'src/KukaManager/KukaManager.csproj')) { throw 'Project not extracted' }
          $testPath = 'tests/KukaManager.SmokeTests/Program.cs'
          $test = Get-Content $testPath -Raw -Encoding UTF8
          if ($test -notmatch '(?m)^using System\.IO;') {
            [IO.File]::WriteAllText($testPath, "using System.IO;`r`n" + $test, [Text.UTF8Encoding]::new($false))
          }

      - name: Apply Kuka 1.1.0 UI overhaul
        shell: pwsh
        run: |
          $payload = 'kuka-ui/patch.gz.b64'
          if ((Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a14ad60f0d3ae54af10cca88dcfa7a568e9927a5263c67be912f420d38abf07e') { throw '1.1.0 payload checksum mismatch' }
          $b64 = (Get-Content $payload -Raw -Encoding ASCII).Trim()
          [IO.File]::WriteAllBytes('kuka-ui-110.patch.gz', [Convert]::FromBase64String($b64))
          $in = [IO.File]::OpenRead('kuka-ui-110.patch.gz'); $out = [IO.File]::Create('kuka-ui-110.patch')
          try { $gz = [IO.Compression.GzipStream]::new($in,[IO.Compression.CompressionMode]::Decompress); try { $gz.CopyTo($out) } finally { $gz.Dispose() } } finally { $out.Dispose(); $in.Dispose() }
          git apply --check --binary --exclude=src/KukaManager/KukaManager.csproj kuka-ui-110.patch
          if ($LASTEXITCODE -ne 0) { throw '1.1.0 patch check failed' }
          git apply --binary --exclude=src/KukaManager/KukaManager.csproj kuka-ui-110.patch
          if ($LASTEXITCODE -ne 0) { throw '1.1.0 patch apply failed' }
          $projectPath='src/KukaManager/KukaManager.csproj'; $project=Get-Content $projectPath -Raw -Encoding UTF8
          $project=[Regex]::Replace($project,'<Version>[^<]+</Version>','<Version>1.1.0</Version>',1)
          [IO.File]::WriteAllText($projectPath,$project,[Text.UTF8Encoding]::new($false))

      - name: Apply 1.1.1 startup XAML fix
        shell: pwsh
        run: |
          $payload='kuka-ui/fix-111.patch.gz.b64'
          if ((Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2c7036849ba76d453a4976ec9a2adc23ff4b461bc56a89119b066663b6b03665') { throw '1.1.1 payload checksum mismatch' }
          $b64=(Get-Content $payload -Raw -Encoding ASCII).Trim()
          [IO.File]::WriteAllBytes('kuka-ui-111.patch.gz',[Convert]::FromBase64String($b64))
          $in=[IO.File]::OpenRead('kuka-ui-111.patch.gz'); $out=[IO.File]::Create('kuka-ui-111.patch')
          try { $gz=[IO.Compression.GzipStream]::new($in,[IO.Compression.CompressionMode]::Decompress); try { $gz.CopyTo($out) } finally { $gz.Dispose() } } finally { $out.Dispose(); $in.Dispose() }
          git apply --check --binary --exclude=src/KukaManager/KukaManager.csproj kuka-ui-111.patch
          if ($LASTEXITCODE -ne 0) { throw '1.1.1 patch check failed' }
          git apply --binary --exclude=src/KukaManager/KukaManager.csproj kuka-ui-111.patch
          if ($LASTEXITCODE -ne 0) { throw '1.1.1 patch apply failed' }
          $projectPath='src/KukaManager/KukaManager.csproj'; $project=Get-Content $projectPath -Raw -Encoding UTF8
          $project=[Regex]::Replace($project,'<Version>[^<]+</Version>','<Version>1.1.1</Version>',1)
          [IO.File]::WriteAllText($projectPath,$project,[Text.UTF8Encoding]::new($false))

      - name: Apply 1.2.0 crisp DPI typography and layout overhaul
        shell: pwsh
        run: |
          $payload='kuka-ui/ui-120.patch.gz.b64'
          if (-not (Test-Path $payload)) { throw 'Missing 1.2.0 UI patch' }
          $actual=(Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '53becf01bbb09769ae0d6c9a4c362f16b9f3818754995dc03f63f713e95d955b') { throw "1.2.0 payload checksum mismatch: $actual" }
          $b64=(Get-Content $payload -Raw -Encoding ASCII).Trim()
          [IO.File]::WriteAllBytes('kuka-ui-120.patch.gz',[Convert]::FromBase64String($b64))
          $in=[IO.File]::OpenRead('kuka-ui-120.patch.gz'); $out=[IO.File]::Create('kuka-ui-120.patch')
          try { $gz=[IO.Compression.GzipStream]::new($in,[IO.Compression.CompressionMode]::Decompress); try { $gz.CopyTo($out) } finally { $gz.Dispose() } } finally { $out.Dispose(); $in.Dispose() }
          git apply --check --binary kuka-ui-120.patch
          if ($LASTEXITCODE -ne 0) { throw '1.2.0 patch check failed' }
          git apply --binary kuka-ui-120.patch
          if ($LASTEXITCODE -ne 0) { throw '1.2.0 patch apply failed' }

          @'
          <?xml version="1.0" encoding="utf-8"?>
          <assembly manifestVersion="1.0" xmlns="urn:schemas-microsoft-com:asm.v1">
            <assemblyIdentity version="1.0.0.0" name="KukaManager.app"/>
            <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3">
              <security><requestedPrivileges><requestedExecutionLevel level="asInvoker" uiAccess="false" /></requestedPrivileges></security>
            </trustInfo>
            <application xmlns="urn:schemas-microsoft-com:asm.v3">
              <windowsSettings>
                <dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware>
                <dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2, PerMonitor</dpiAwareness>
                <longPathAware xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">true</longPathAware>
              </windowsSettings>
            </application>
          </assembly>
          '@ | Set-Content 'src/KukaManager/app.manifest' -Encoding utf8

          $testPath='tests/KukaManager.SmokeTests/Program.cs'
          $test=Get-Content $testPath -Raw -Encoding UTF8
          if ($test -notmatch '(?m)^using System\.Windows\.Controls;') { $test=$test.Replace("using System.Windows;`r`n","using System.Windows;`r`nusing System.Windows.Controls;`r`n") }
          if ($test -notmatch 'modern input, picker and grid templates instantiate and layout') {
            $anchor='        Check(app.Resources.MergedDictionaries.Count > 0, "modern WPF theme parses and loads");'
            $extra=@'

        var controlsHost = new StackPanel { Width = 900, Height = 600 };
        var combo = new ComboBox { Width = 240 };
        combo.Items.Add("数学"); combo.Items.Add("Python"); combo.SelectedIndex = 0;
        var datePicker = new DatePicker { Width = 240, SelectedDate = DateTime.Today };
        var calendar = new Calendar();
        var grid = new DataGrid { Width = 720, Height = 180 };
        controlsHost.Children.Add(combo); controlsHost.Children.Add(datePicker); controlsHost.Children.Add(calendar); controlsHost.Children.Add(grid);
        controlsHost.Measure(new Size(900, 600)); controlsHost.Arrange(new Rect(0, 0, 900, 600));
        combo.ApplyTemplate(); datePicker.ApplyTemplate(); calendar.ApplyTemplate(); grid.ApplyTemplate(); controlsHost.UpdateLayout();
        Check(combo.Template is not null && datePicker.Template is not null && grid.Template is not null,
            "modern input, picker and grid templates instantiate and layout");
'@
            if (-not $test.Contains($anchor)) { throw 'Theme test anchor missing' }
            $test=$test.Replace($anchor,$anchor+$extra)
          }
          [IO.File]::WriteAllText($testPath,$test,[Text.UTF8Encoding]::new($false))

          if (-not (Test-Path 'src/KukaManager/app.manifest')) { throw 'PerMonitorV2 manifest missing' }
          $manifest=Get-Content 'src/KukaManager/app.manifest' -Raw -Encoding UTF8
          if ($manifest -notmatch 'PerMonitorV2') { throw 'PerMonitorV2 manifest invalid' }
          $theme=Get-Content 'src/KukaManager/Design/Theme.cs' -Raw -Encoding UTF8
          if ($theme -notmatch 'Segoe UI Variable Text') { throw 'Segoe UI Variable typography missing' }
          if ($theme -notmatch 'TextFormattingMode') { throw 'Crisp text rendering settings missing' }
          $appPaths=Get-Content 'src/KukaManager/Utils/AppPaths.cs' -Raw -Encoding UTF8
          if ($appPaths -notmatch '1\.2\.0') { throw 'App version did not update to 1.2.0' }
          $project=Get-Content 'src/KukaManager/KukaManager.csproj' -Raw -Encoding UTF8
          if ($project -notmatch '<Version>1\.2\.0</Version>') { throw 'Project version did not update to 1.2.0' }

      - name: Restore main app
        run: dotnet restore .\src\KukaManager\KukaManager.csproj --source https://api.nuget.org/v3/index.json

      - name: Build main app
        run: dotnet build .\src\KukaManager\KukaManager.csproj -c Release --no-restore

      - name: Restore smoke tests
        run: dotnet restore .\tests\KukaManager.SmokeTests\KukaManager.SmokeTests.csproj --source https://api.nuget.org/v3/index.json

      - name: Build smoke tests
        run: dotnet build .\tests\KukaManager.SmokeTests\KukaManager.SmokeTests.csproj -c Release --no-restore

      - name: Run smoke tests including theme and control templates
        run: dotnet run --project .\tests\KukaManager.SmokeTests\KukaManager.SmokeTests.csproj -c Release --no-build

      - name: Restore win-x64 publish assets
        run: dotnet restore .\src\KukaManager\KukaManager.csproj -r win-x64 --source https://api.nuget.org/v3/index.json

      - name: Publish self-contained win-x64
        run: dotnet publish .\src\KukaManager\KukaManager.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\dist\KukaManager

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe=Resolve-Path '.\dist\KukaManager\KukaManager.exe'
          $size=(Get-Item $exe).Length
          if ($size -lt 100000) { throw "Executable unexpectedly small: $size" }
          Write-Host "Verified executable: $exe ($size bytes)"

      - name: Startup smoke test
        shell: pwsh
        run: |
          $exe=Resolve-Path '.\dist\KukaManager\KukaManager.exe'
          $p=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "KukaManager exited during startup with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'KukaManager 1.2.0 stayed alive for 5 seconds.'

      - name: Package verified build
        shell: pwsh
        run: Compress-Archive -Path '.\dist\KukaManager\*' -DestinationPath '.\KukaManager-CSharp-1.2.0-win-x64.zip' -Force

      - name: Upload verified Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KukaManager-CSharp-1.2.0-win-x64
          path: KukaManager-CSharp-1.2.0-win-x64.zip
          if-no-files-found: error
