name: Kuka CSharp UI 1.2.0 Windows Verify

on:
  workflow_dispatch:
  push:
    branches:
      - kuka-ui-110
    paths:
      - 'kuka-ci/**'
      - 'kuka-ui/**'
      - '.github/workflows/kuka-csharp-ci.yml'

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated UI branch
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Build test publish and startup verify Kuka 1.2.0
        shell: pwsh
        run: .\kuka-ui\build-120.ps1

      - name: Upload verified Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KukaManager-CSharp-1.2.0-win-x64
          path: KukaManager-CSharp-1.2.0-win-x64.zip
          if-no-files-found: error
