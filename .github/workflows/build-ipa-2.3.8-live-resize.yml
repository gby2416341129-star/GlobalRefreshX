name: Build Speed 2.3.8 Live Resize IPA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa-2.3.8-live-resize.yml'
      - 'patches/speed-2.3.8-live-resize.patch'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASELINE_SOURCE: Speed-2.3.7-Compact-Media-Source.tar.gz

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Speed 2.3.7 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/source"
          gh release download dev-latest \
            --pattern "$BASELINE_SOURCE" \
            --dir "$GITHUB_WORKSPACE/baseline"
          tar -xzf "$GITHUB_WORKSPACE/baseline/$BASELINE_SOURCE" \
            -C "$GITHUB_WORKSPACE/source"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Apply Speed 2.3.8 live-resize patch
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$GITHUB_WORKSPACE/patches/speed-2.3.8-live-resize.patch"
          actual_patch_sha="$(shasum -a 256 "$patch_file" | awk '{print $1}')"
          test "$actual_patch_sha" = "c6ea9020a7156c590f048e6b2655dc3910fea58b9ecbcf7a6f4660c7bea8c14d"

          cd "$PROJECT_ROOT"
          patch --dry-run -p1 < "$patch_file"
          patch -p1 < "$patch_file"
          rm -rf "$PROJECT_ROOT/build" "$PROJECT_ROOT/dist"

          grep -q 'MARKETING_VERSION = 2.3.8' "$PROJECT_ROOT/pip_swift/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'CURRENT_PROJECT_VERSION = 2026090913' "$PROJECT_ROOT/pip_swift/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'interactiveGenerationQueue' "$PROJECT_ROOT/pip_swift/pip_swift/ViewController.swift"
          grep -q 'lastAppliedPlayerLayerMediaRequestGeneration' "$PROJECT_ROOT/pip_swift/pip_swift/ViewController.swift"
          grep -q 'Accept completed preview requests in monotonically newer order' "$PROJECT_ROOT/pip_swift/pip_swift/ViewController.swift"

          media="$PROJECT_ROOT/pip_swift/pip_swift/CompatibilityMedia"
          test "$(find "$media" -type f -name 'h*.mov' | wc -l | tr -d ' ')" -eq 3
          test "$(find "$media" -type f -name 'h*.spm' | wc -l | tr -d ' ')" -eq 217

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Verify project
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Package clean outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-2.3.8-Live-Resize-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.3.8-Live-Resize-Source.tar.gz"

          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          unzip -t "$ipa"
          raw_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.mov$' | wc -l | tr -d ' ')"
          compact_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.spm$' | wc -l | tr -d ' ')"
          test "$raw_count" -eq 3
          test "$compact_count" -eq 217
          echo "Final IPA bytes: $(stat -f%z "$ipa")"
          shasum -a 256 "$ipa" > "$ipa.sha256"

          tar \
            --exclude='./build' \
            --exclude='./dist' \
            -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-2.3.8-Live-Resize
          path: |
            out/Speed-2.3.8-Live-Resize-unsigned.ipa
            out/Speed-2.3.8-Live-Resize-unsigned.ipa.sha256
            out/Speed-2.3.8-Live-Resize-Source.tar.gz
            out/Speed-2.3.8-Live-Resize-Source.tar.gz.sha256
          if-no-files-found: error

      - name: Publish rolling prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-2.3.8-Live-Resize-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.3.8-Live-Resize-Source.tar.gz"

          gh release upload dev-latest "$ipa" "$src" --clobber
          gh release edit dev-latest \
            --target "$GITHUB_SHA" \
            --title "Speed 2.3.8 Live Resize" \
            --notes "Fixes Compatibility floating-window height control so dragging can visibly resize continuously instead of waiting for the final point value. Compact media now uses a separate user-initiated interactive queue, tiny .spm assets are primed off-main, completed preview requests may advance in monotonic order during a drag, and the existing 8-file LRU trim resumes after commit. Standard 120Hz route and UI are unchanged. Unsigned IPA: sign before installation." \
            --prerelease
