name: Build Speed 2.6.3 Core Logic Cleanup

on:
  push:
    branches: [speed-2.6-dev]
    paths:
      - '.github/workflows/build-ipa-2.6.3-core-logic-cleanup.yml'
      - 'scripts/speed263_patch.py.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASELINE_SOURCE: Speed-2.6.2-Compatibility-Geometry-Core-Source.tar.gz
  PATCH_SHA256: 35db305dee0d92c5c2769806cd804a029df935c5fbae4bee09ba84a9a32a8914

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out Speed 2.6 development
        uses: actions/checkout@v4
        with:
          ref: speed-2.6-dev

      - name: Download Speed 2.6.2 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/source"
          gh release download dev-latest --pattern "$BASELINE_SOURCE" --dir "$GITHUB_WORKSPACE/baseline"
          tar -xzf "$GITHUB_WORKSPACE/baseline/$BASELINE_SOURCE" -C "$GITHUB_WORKSPACE/source"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Apply Speed 2.6.3 core cleanup
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE/scripts/speed263_patch.py.gz.b64" | base64 -D | gunzip > "$RUNNER_TEMP/speed263_patch.py"
          actual="$(shasum -a 256 "$RUNNER_TEMP/speed263_patch.py" | awk '{print $1}')"
          test "$actual" = "$PATCH_SHA256"
          python3 "$RUNNER_TEMP/speed263_patch.py" "$PROJECT_ROOT"
          rm -rf "$PROJECT_ROOT/build" "$PROJECT_ROOT/dist"

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Verify integration
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Require warning-clean Swift build
        shell: bash
        run: |
          set -euo pipefail
          log="$PROJECT_ROOT/build/diagnostics/xcodebuild.log"
          test -f "$log"
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' "$log"; then
            echo 'Swift warnings are not allowed in Speed 2.6.3.' >&2
            exit 1
          fi

      - name: Validate and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-2.6.3-Core-Logic-Cleanup-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.6.3-Core-Logic-Cleanup-Source.tar.gz"
          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          unzip -t "$ipa"
          unzip -l "$ipa" | grep -q 'Payload/Speed.app/PlugIns/SpeedControls.appex/SpeedControls$'
          raw_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.mov$' | wc -l | tr -d ' ')"
          compact_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.spm$' | wc -l | tr -d ' ')"
          test "$raw_count" -eq 3
          test "$compact_count" -eq 217
          python3 -c "import plistlib,zipfile; z=zipfile.ZipFile('$ipa'); a=plistlib.loads(z.read('Payload/Speed.app/Info.plist')); e=plistlib.loads(z.read('Payload/Speed.app/PlugIns/SpeedControls.appex/Info.plist')); assert a['CFBundleShortVersionString']=='2.6.3' and a['CFBundleVersion']=='2026091007'; assert e['CFBundleShortVersionString']=='2.6.3' and e['CFBundleVersion']=='2026091007'; print('Validated Speed 2.6.3 app + extension')"
          shasum -a 256 "$ipa" > "$ipa.sha256"
          tar --exclude='./build' --exclude='./dist' -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-2.6.3-Core-Logic-Cleanup
          path: |
            out/Speed-2.6.3-Core-Logic-Cleanup-unsigned.ipa
            out/Speed-2.6.3-Core-Logic-Cleanup-unsigned.ipa.sha256
            out/Speed-2.6.3-Core-Logic-Cleanup-Source.tar.gz
            out/Speed-2.6.3-Core-Logic-Cleanup-Source.tar.gz.sha256
          if-no-files-found: error

      - name: Publish Speed 2.6.3 test assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-2.6.3-Core-Logic-Cleanup-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.6.3-Core-Logic-Cleanup-Source.tar.gz"
          gh release upload dev-latest "$ipa" "$src" --clobber
          gh release edit dev-latest \
            --target "$GITHUB_SHA" \
            --title 'Speed 2.6.3 Core Logic Cleanup' \
            --notes 'Core stability cleanup before Adaptive Engine work. Separates user mode, PiP backend, refresh policy, and fallback state; gates the app-level CADisplayLink to an active Speed session; fixes Auto fallback stop ordering and rebuild behavior; isolates Standard and Compatibility remembered heights; fixes 1pt Compatibility hidden semantics; makes one-tap hide transient without overwriting remembered height; fixes height input double-commit and custom style/default-height mismatch; removes guaranteed 120Hz wording; caches Performance Lab percentile work; and quarantines the known-crashing UIUpdateLink/Hybrid runtime in this stable build. The Start & Hide auto-lock path now explicitly restores system auto-lock eligibility after hidden geometry commits, releases display-sleep/backgrounding/audio/background-task blockers, and retains the lightweight hidden state. No new compatibility videos or per-frame heavy work are added.' \
            --prerelease
