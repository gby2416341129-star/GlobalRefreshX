name: Build Speed 2.3.7 Compact Compatibility IPA v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa-2.3.7-compact-compat-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download exact Speed 2.3.6 baseline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/source"
          gh run download 34309086303 \
            --name Speed-2.3.6-Compatibility-Response \
            --dir "$GITHUB_WORKSPACE/baseline"
          tar -xzf "$GITHUB_WORKSPACE/baseline/Speed-2.3.6-Compatibility-Response-Source.tar.gz" \
            -C "$GITHUB_WORKSPACE/source"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Apply compact compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - \
            "$GITHUB_WORKSPACE/patches/speed-2.3.7-compact.part01" \
            "$GITHUB_WORKSPACE/patches/speed-2.3.7-compact.part02" \
            "$RUNNER_TEMP/speed-2.3.7.patch" <<'PY'
          import base64, gzip, hashlib, pathlib, sys
          encoded = b''.join(pathlib.Path(p).read_bytes() for p in sys.argv[1:-1])
          encoded = b''.join(encoded.split())
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = '1c01fe36c517841f293a88499cfd03cf6563fa092ac84b1a943ba85ba0a43266'
          actual = hashlib.sha256(patch).hexdigest()
          assert actual == expected, (actual, expected)
          pathlib.Path(sys.argv[-1]).write_bytes(patch)
          PY

          cd "$PROJECT_ROOT"
          patch --dry-run -p1 < "$RUNNER_TEMP/speed-2.3.7.patch"
          patch -p1 < "$RUNNER_TEMP/speed-2.3.7.patch"
          rm -rf "$PROJECT_ROOT/build" "$PROJECT_ROOT/dist"

          grep -q 'MARKETING_VERSION = 2.3.7' "$PROJECT_ROOT/pip_swift/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'CURRENT_PROJECT_VERSION = 2026090912' "$PROJECT_ROOT/pip_swift/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'compression_decode_buffer' "$PROJECT_ROOT/pip_swift/pip_swift/ViewController.swift"

      - name: Build compact solid compatibility media pack
        shell: bash
        run: |
          set -euo pipefail
          media="$PROJECT_ROOT/pip_swift/pip_swift/CompatibilityMedia"
          test "$(find "$media" -type f -name 'h*.mov' | wc -l | tr -d ' ')" -eq 220

          python3 - "$media" <<'PY'
          import pathlib, struct, sys, zlib
          media = pathlib.Path(sys.argv[1])
          clips = [(media / f'h{h:03d}.mov').read_bytes() for h in range(1, 221)]
          assert all(clips)
          raw = b''.join(struct.pack('<I', len(x)) for x in clips) + b''.join(clips)
          blob = b'SPDCPK01' + struct.pack('<Q', len(raw)) + zlib.compress(raw, 9)
          out = media / 'compatibility-media-v1.pack'
          out.write_bytes(blob)

          check = out.read_bytes()
          assert check[:8] == b'SPDCPK01'
          raw_size = struct.unpack('<Q', check[8:16])[0]
          inflated = zlib.decompress(check[16:])
          assert len(inflated) == raw_size == len(raw)
          lengths = [struct.unpack_from('<I', inflated, i * 4)[0] for i in range(220)]
          cursor = 220 * 4
          for i, length in enumerate(lengths):
              assert inflated[cursor:cursor + length] == clips[i]
              cursor += length
          assert cursor == len(inflated)
          assert len(check) < 400_000, len(check)

          keep = {'h001.mov', 'h022.mov', 'h120.mov'}
          for p in media.glob('h*.mov'):
              if p.name not in keep:
                  p.unlink()
          assert {p.name for p in media.glob('h*.mov')} == keep
          print(f'packed_bytes={len(check)} raw_bytes={len(raw)}')
          PY

          test "$(find "$media" -type f -name 'h*.mov' | wc -l | tr -d ' ')" -eq 3
          test -f "$media/h001.mov"
          test -f "$media/h022.mov"
          test -f "$media/h120.mov"
          test -f "$media/compatibility-media-v1.pack"

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Verify project
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Package and size-check outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-2.3.7-Compact-Compatibility-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.3.7-Compact-Compatibility-Source.tar.gz"

          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          unzip -t "$ipa"
          test "$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.mov$' | wc -l | tr -d ' ')" -eq 3
          unzip -l "$ipa" | grep -q 'Payload/Speed.app/CompatibilityMedia/compatibility-media-v1.pack'

          app_uncompressed_bytes="$(unzip -l "$ipa" | awk '/Payload\/Speed.app\// {sum += $1} END {print sum + 0}')"
          ipa_bytes="$(stat -f%z "$ipa")"
          echo "Unsigned IPA bytes: $ipa_bytes"
          echo "Uncompressed Speed.app bytes: $app_uncompressed_bytes"
          test "$app_uncompressed_bytes" -lt 4000000

          shasum -a 256 "$ipa" > "$ipa.sha256"
          tar --exclude='./build' --exclude='./dist' -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-2.3.7-Compact-Compatibility
          path: |
            out/Speed-2.3.7-Compact-Compatibility-unsigned.ipa
            out/Speed-2.3.7-Compact-Compatibility-unsigned.ipa.sha256
            out/Speed-2.3.7-Compact-Compatibility-Source.tar.gz
            out/Speed-2.3.7-Compact-Compatibility-Source.tar.gz.sha256
          if-no-files-found: error

      - name: Publish rolling prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-2.3.7-Compact-Compatibility-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.3.7-Compact-Compatibility-Source.tar.gz"
          gh release upload dev-latest "$ipa" "$src" --clobber
          gh release edit dev-latest \
            --target "$GITHUB_SHA" \
            --title "Speed 2.3.7 Compact Compatibility" \
            --notes "Preserves the 2.3.6 compatibility response path while replacing 220 standalone geometry movies with one compact solid zlib pack plus 1/22/120pt fast-path clips. Exact 1-220pt geometry remains available. Archive inflation is off-main and only Compatibility mode uses the expanded memory. Standard 120Hz route and UI are unchanged. Unsigned IPA: sign before installation." \
            --prerelease
