name: Build Speed 3.0.2 Background Driver State Fix

on:
  push:
    branches: [speed-2.6-dev]
    paths:
      - '.github/workflows/build-ipa-3.0.2-background-driver-state-fix.yml'
      - 'scripts/speed302/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASELINE_SOURCE: Speed-3.0.1-Driver-State-Foreground-Restore-Source.tar.gz
  PATCH_SHA256: 4cf92e00a1e4883b4d3246332a5c82b7f736560fcc8e83f7c29bc7c3b9eb1bb8

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out Speed development
        uses: actions/checkout@v4
        with:
          ref: speed-2.6-dev

      - name: Download Speed 3.0.1 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/source"
          gh release download dev-latest --pattern "$BASELINE_SOURCE" --dir "$GITHUB_WORKSPACE/baseline"
          tar -xzf "$GITHUB_WORKSPACE/baseline/$BASELINE_SOURCE" -C "$GITHUB_WORKSPACE/source"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Apply Speed 3.0.2 background driver state fix
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/scripts/speed302/part*.b64 | base64 -D | gunzip > "$RUNNER_TEMP/speed302.patch"
          actual="$(shasum -a 256 "$RUNNER_TEMP/speed302.patch" | awk '{print $1}')"
          test "$actual" = "$PATCH_SHA256"
          cd "$PROJECT_ROOT"
          patch --dry-run -p1 < "$RUNNER_TEMP/speed302.patch"
          patch -p1 < "$RUNNER_TEMP/speed302.patch"
          rm -rf "$PROJECT_ROOT/build" "$PROJECT_ROOT/dist"

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Verify integration
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Require warning-clean Swift build
        shell: bash
        run: |
          set -euo pipefail
          log="$PROJECT_ROOT/build/diagnostics/xcodebuild.log"
          test -f "$log"
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' "$log"; then
            echo 'Swift warnings are not allowed in Speed 3.0.2.' >&2
            exit 1
          fi

      - name: Validate and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-3.0.2-Background-Driver-State-Fix-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-3.0.2-Background-Driver-State-Fix-Source.tar.gz"
          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          unzip -t "$ipa"
          unzip -l "$ipa" | grep -q 'Payload/Speed.app/PlugIns/SpeedControls.appex/SpeedControls$'
          raw_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.mov$' | wc -l | tr -d ' ')"
          compact_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.spm$' | wc -l | tr -d ' ')"
          test "$raw_count" -eq 3
          test "$compact_count" -eq 217
          python3 -c "import plistlib,zipfile; z=zipfile.ZipFile('$ipa'); a=plistlib.loads(z.read('Payload/Speed.app/Info.plist')); e=plistlib.loads(z.read('Payload/Speed.app/PlugIns/SpeedControls.appex/Info.plist')); assert a['CFBundleShortVersionString']=='3.0.2' and a['CFBundleVersion']=='2026091106'; assert e['CFBundleShortVersionString']=='3.0.2' and e['CFBundleVersion']=='2026091106'; print('Validated Speed 3.0.2 app + extension')"
          shasum -a 256 "$ipa" > "$ipa.sha256"
          tar --exclude='./build' --exclude='./dist' -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-3.0.2-Background-Driver-State-Fix
          path: |
            out/Speed-3.0.2-Background-Driver-State-Fix-unsigned.ipa
            out/Speed-3.0.2-Background-Driver-State-Fix-unsigned.ipa.sha256
            out/Speed-3.0.2-Background-Driver-State-Fix-Source.tar.gz
            out/Speed-3.0.2-Background-Driver-State-Fix-Source.tar.gz.sha256
          if-no-files-found: error

      - name: Publish Speed 3.0.2 test assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-3.0.2-Background-Driver-State-Fix-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-3.0.2-Background-Driver-State-Fix-Source.tar.gz"
          gh release upload dev-latest "$ipa" "$src" --clobber
          gh release edit dev-latest \
            --target "$GITHUB_SHA" \
            --title 'Speed 3.0.2 Background Driver State Fix' \
            --notes 'Fixes the remaining Speed 3.0 lifecycle/state-model contradiction. Leaving Speed foreground no longer silently changes a requested UIUpdateLink or Hybrid driver into CADisplayLink. Instead the app-local refresh driver is explicitly suspended outside foreground while the requested target remains unchanged and PiP continues on the system-managed path. Cadence Recovery is paused outside foreground so background/app-switcher time cannot inflate recovery counts. Returning to Speed performs bounded target-driver reattachment; only a genuine UIUpdateLink rebind failure after the restore grace window falls back to CADisplayLink and reports that as a real fallback. UI now distinguishes target driver, paused/restoring runtime state, effective driver, and real fallback reason. Preserves Adaptive Engine, calibration, Crash Shield, all Laboratory experiments, one-tap hide fixes, PiP conflict handling, and 3 MOV + 217 SPM compatibility media.' \
            --prerelease
