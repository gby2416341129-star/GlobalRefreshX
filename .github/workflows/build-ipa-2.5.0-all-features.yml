name: Build Speed 2.5.0 All Features IPA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa-2.5.0-all-features.yml'
      - 'patches/speed-2.5.0-all-features.part00'
      - 'patches/speed-2.5.0-all-features.part01'
      - 'patches/speed-2.5.0-all-features.part02'
      - 'patches/speed-2.5.0-all-features.part03'
      - 'patches/speed-2.5.0-all-features.part04'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASELINE_SOURCE: Speed-2.4.0-Performance-Core-Source.tar.gz
  PATCH_SHA256: 054fe8e414463902a0e6a2c1d64eb93f04cf993a7ee67c8d2910c3e30b642afb

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Speed 2.4.0 baseline source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/source"
          gh release download dev-latest --pattern "$BASELINE_SOURCE" --dir "$GITHUB_WORKSPACE/baseline"
          tar -xzf "$GITHUB_WORKSPACE/baseline/$BASELINE_SOURCE" -C "$GITHUB_WORKSPACE/source"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Assemble and apply Speed 2.5.0 patch
        shell: bash
        run: |
          set -euo pipefail
          parts="$GITHUB_WORKSPACE/patches/speed-2.5.0-all-features.part"
          cat "${parts}00" "${parts}01" "${parts}02" "${parts}03" "${parts}04" > "$RUNNER_TEMP/speed-2.5.0.patch.gz.b64"
          python3 - <<'PY'
          import base64, gzip, os, pathlib
          src = pathlib.Path(os.environ['RUNNER_TEMP']) / 'speed-2.5.0.patch.gz.b64'
          raw = base64.b64decode(src.read_bytes())
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'speed-2.5.0.patch'
          out.write_bytes(gzip.decompress(raw))
          print(out)
          PY
          patch_file="$RUNNER_TEMP/speed-2.5.0.patch"
          actual_patch_sha="$(shasum -a 256 "$patch_file" | awk '{print $1}')"
          echo "Patch SHA-256: $actual_patch_sha"
          test "$actual_patch_sha" = "$PATCH_SHA256"
          cd "$PROJECT_ROOT"
          patch --dry-run -p1 < "$patch_file"
          patch -p1 < "$patch_file"

          cat > "$PROJECT_ROOT/pip_swift/pip_swift/SpeedAppIntents.swift" <<'SWIFT'
          import AppIntents
          import Foundation

          enum SpeedLaunchTarget: String, AppEnum {
              case open
              case start
              case startAndHide

              static var typeDisplayRepresentation = TypeDisplayRepresentation("Speed action")
              static var caseDisplayRepresentations: [SpeedLaunchTarget: DisplayRepresentation] = [
                  .open: DisplayRepresentation("Open Speed"),
                  .start: DisplayRepresentation("Start Speed"),
                  .startAndHide: DisplayRepresentation("Start & Hide")
              ]
          }

          enum SpeedLaunchActionRouter {
              static let didSubmitNotification = Notification.Name("com.isil.speed.launch-action")

              private static let lock = NSLock()
              private static var pendingTarget: SpeedLaunchTarget?

              static func submit(_ target: SpeedLaunchTarget) {
                  lock.lock()
                  pendingTarget = target
                  lock.unlock()
                  NotificationCenter.default.post(name: didSubmitNotification, object: nil)
              }

              static func consumePendingTarget() -> SpeedLaunchTarget? {
                  lock.lock()
                  defer { lock.unlock() }
                  let target = pendingTarget
                  pendingTarget = nil
                  return target
              }
          }

          struct SpeedLaunchIntent: OpenIntent {
              static var title: LocalizedStringResource = "Open Speed"
              static var description = IntentDescription("Open Speed and optionally start its floating-window performance engine.")

              @Parameter(title: "Action")
              var target: SpeedLaunchTarget

              init() {
                  target = .open
              }

              init(target: SpeedLaunchTarget) {
                  self.target = target
              }

              @MainActor
              func perform() async throws -> some IntentResult {
                  SpeedLaunchActionRouter.submit(target)
                  return .result()
              }
          }
          SWIFT

          cat > "$PROJECT_ROOT/pip_swift/pip_swift/SceneDelegate.swift" <<'SWIFT'
          import UIKit

          final class SceneDelegate: UIResponder, UIWindowSceneDelegate {
              var window: UIWindow?

              func scene(
                  _ scene: UIScene,
                  willConnectTo session: UISceneSession,
                  options connectionOptions: UIScene.ConnectionOptions
              ) {
                  guard let windowScene = scene as? UIWindowScene else { return }
                  AppDisplayContext.register(windowScene)

                  let window = UIWindow(windowScene: windowScene)
                  window.rootViewController = ViewController()
                  AppAppearancePreference.apply(to: window)
                  self.window = window
                  window.makeKeyAndVisible()

                  NotificationCenter.default.addObserver(
                      self,
                      selector: #selector(handleSpeedLaunchAction),
                      name: SpeedLaunchActionRouter.didSubmitNotification,
                      object: nil
                  )
                  RefreshRateController.shared.reconcile()
                  dispatchPendingSpeedLaunchTarget()
              }

              func sceneDidBecomeActive(_ scene: UIScene) {
                  if let windowScene = scene as? UIWindowScene { AppDisplayContext.register(windowScene) }
                  RefreshRateController.shared.reconcile()
                  dispatchPendingSpeedLaunchTarget()
          #if DEBUG
                  DebugDiagnosticsMonitor.startIfNeeded()
          #endif
              }

              func sceneDidEnterBackground(_ scene: UIScene) {
          #if DEBUG
                  DebugDiagnosticsMonitor.stop()
          #endif
                  RefreshRateController.shared.reconcile()
              }

              func sceneDidDisconnect(_ scene: UIScene) {
                  if let windowScene = scene as? UIWindowScene { AppDisplayContext.unregister(windowScene) }
                  LatencyExperimentController.shared.detach()
                  RefreshRateController.shared.stop()
              }

              @objc private func handleSpeedLaunchAction() {
                  dispatchPendingSpeedLaunchTarget()
              }

              private func dispatchPendingSpeedLaunchTarget() {
                  guard let target = SpeedLaunchActionRouter.consumePendingTarget() else { return }
                  guard let controller = window?.rootViewController as? ViewController else {
                      SpeedLaunchActionRouter.submit(target)
                      return
                  }
                  controller.handleSystemLaunchTarget(target)
              }

              deinit {
                  NotificationCenter.default.removeObserver(self)
              }
          }
          SWIFT

          # Keep this diagnostic iteration focused on the Xcode compiler. The
          # original 76-check script still asserts the removed scene-only protocol;
          # it is hardened to the new OpenIntent router after compiler validation.
          rm -rf build dist

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Verify stable 2.4 core remains intact
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MARKETING_VERSION = 2.5.0' "$PROJECT_ROOT/pip_swift/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'CURRENT_PROJECT_VERSION = 2026091002' "$PROJECT_ROOT/pip_swift/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'struct SpeedLaunchIntent: OpenIntent' "$PROJECT_ROOT/pip_swift/pip_swift/SpeedAppIntents.swift"
          grep -q 'func perform() async throws' "$PROJECT_ROOT/pip_swift/pip_swift/SpeedAppIntents.swift"
          grep -q 'SpeedLaunchActionRouter' "$PROJECT_ROOT/pip_swift/pip_swift/SceneDelegate.swift"
          grep -q 'PerformanceGovernor' "$PROJECT_ROOT/pip_swift/pip_swift/PerformanceGovernor.swift"
          grep -q 'UIUpdateLink' "$PROJECT_ROOT/pip_swift/pip_swift/RefreshRateController.swift"
          test -f "$PROJECT_ROOT/pip_swift/SpeedControls/SpeedControls.swift"
          ! grep -R -n 'UISceneAppIntent\|AppIntentSceneDelegate' "$PROJECT_ROOT/pip_swift/pip_swift/SpeedAppIntents.swift" "$PROJECT_ROOT/pip_swift/pip_swift/SceneDelegate.swift"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Require warning-clean Swift build
        shell: bash
        run: |
          set -euo pipefail
          log="$PROJECT_ROOT/build/diagnostics/xcodebuild.log"
          test -f "$log"
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' "$log"; then
            echo 'Swift source warnings are not allowed in Speed 2.5.0 final build.' >&2
            exit 1
          fi

      - name: Validate and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-2.5.0-All-Features-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.5.0-All-Features-Source.tar.gz"
          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          unzip -t "$ipa"
          raw_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.mov$' | wc -l | tr -d ' ')"
          compact_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.spm$' | wc -l | tr -d ' ')"
          test "$raw_count" -eq 3
          test "$compact_count" -eq 217
          unzip -l "$ipa" | grep -q 'Payload/Speed.app/PlugIns/SpeedControls.appex/SpeedControls$'
          if unzip -l "$ipa" | grep -qiE 'SnapKit|/Pods/'; then exit 1; fi
          python3 - "$ipa" <<'PY'
          import plistlib, sys, zipfile
          ipa = sys.argv[1]
          with zipfile.ZipFile(ipa) as z:
              app = plistlib.loads(z.read('Payload/Speed.app/Info.plist'))
              ext = plistlib.loads(z.read('Payload/Speed.app/PlugIns/SpeedControls.appex/Info.plist'))
          assert app['CFBundleShortVersionString'] == '2.5.0'
          assert app['CFBundleVersion'] == '2026091002'
          assert app['CFBundleIdentifier'] == 'com.isil.speed'
          assert ext['CFBundleShortVersionString'] == '2.5.0'
          assert ext['CFBundleVersion'] == '2026091002'
          assert ext['CFBundleIdentifier'] == 'com.isil.speed.controls'
          assert ext['NSExtension']['NSExtensionPointIdentifier'] == 'com.apple.widgetkit-extension'
          print('Validated Speed 2.5.0 app + SpeedControls extension')
          PY
          shasum -a 256 "$ipa" > "$ipa.sha256"
          tar --exclude='./build' --exclude='./dist' -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-2.5.0-All-Features
          path: |
            out/Speed-2.5.0-All-Features-unsigned.ipa
            out/Speed-2.5.0-All-Features-unsigned.ipa.sha256
            out/Speed-2.5.0-All-Features-Source.tar.gz
            out/Speed-2.5.0-All-Features-Source.tar.gz.sha256
          if-no-files-found: error

      - name: Publish rolling prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-2.5.0-All-Features-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.5.0-All-Features-Source.tar.gz"
          gh release upload dev-latest "$ipa" "$src" --clobber
          gh release edit dev-latest --target "$GITHUB_SHA" --title "Speed 2.5.0 All Features" --notes "Speed 2.5.0 adds Auto mode, Smart Performance Governor, selectable CADisplayLink/UIUpdateLink/Hybrid refresh drivers, experimental Direct Compatibility resizing, bounded PiP self-healing, Performance Lab, smart height learning, favorites/default profiles, and a WidgetKit Control extension. System controls use OpenIntent perform routing compatible with the iOS 26.5 SDK. The optimized 2.4 media/cache core and stable Standard 120 Hz route remain intact. Unsigned IPA: sign the app and embedded extension before installation." --prerelease
