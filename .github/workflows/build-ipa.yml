name: Build Speed 2.3.1 Laboratory 2 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct Speed 2.3.1 Laboratory 2 source
        shell: bash
        run: |
          set -euo pipefail

          base_archive="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f \
            \( -name 'Speed-2.2.0-Final-Candidate-1-Source.tar.gz' \
               -o -name 'Speed-2.2.0-Final-Candidate-1-Source.tar.gz*' \
               -o -iname '*Speed*2.2.0*Final*Candidate*1*Source*.tar.gz*' \) \
            -print -quit)"
          lab_payload="$RUNNER_TEMP/speed-2.3.0-lab1.patch.gz.b64"
          lab_patch="$RUNNER_TEMP/speed-2.3.0-lab1.patch"
          hotfix_payload="$GITHUB_WORKSPACE/speed-2.3.1-lab2-hotfix.patch.gz.b64"
          hotfix_patch="$RUNNER_TEMP/speed-2.3.1-lab2-hotfix.patch"

          test -n "$base_archive"
          cat \
            "$GITHUB_WORKSPACE/payload/speed-2.3.0-lab1.b64.part-00" \
            "$GITHUB_WORKSPACE/payload/speed-2.3.0-lab1.b64.part-01" \
            "$GITHUB_WORKSPACE/payload/speed-2.3.0-lab1.b64.part-02" \
            "$GITHUB_WORKSPACE/payload/speed-2.3.0-lab1.b64.part-03" \
            > "$lab_payload"

          test "$(wc -c < "$lab_payload" | tr -d ' ')" -eq 11652
          echo "d99838dd1c0891c74587e3c590a68081fec3cbdbf032e67472c8bcfa5de3a279  $lab_payload" | shasum -a 256 -c -

          python3 - "$lab_payload" "$lab_patch" <<'PYCODE'
          import base64, gzip, pathlib, sys
          payload = pathlib.Path(sys.argv[1]).read_text().strip()
          pathlib.Path(sys.argv[2]).write_bytes(gzip.decompress(base64.b64decode(payload, validate=True)))
          PYCODE

          echo "f98f649da4645157c0da9b282385b97c29a7dbc75b19ab6ae7a3b486304d0b55  $lab_patch" | shasum -a 256 -c -

          test -f "$hotfix_payload"
          python3 - "$hotfix_payload" "$hotfix_patch" <<'PYCODE'
          import base64, gzip, pathlib, sys
          payload = pathlib.Path(sys.argv[1]).read_text().strip()
          pathlib.Path(sys.argv[2]).write_bytes(gzip.decompress(base64.b64decode(payload, validate=True)))
          PYCODE

          echo "648e436670acf5e88599e733148c79648fe0aa8afa995e003f8b31bab287036a  $hotfix_patch" | shasum -a 256 -c -

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"
          tar -xzf "$base_archive" -C "$GITHUB_WORKSPACE/source"
          patch -d "$GITHUB_WORKSPACE/source" -p1 < "$lab_patch"
          patch -d "$GITHUB_WORKSPACE/source" -p1 < "$hotfix_patch"

          project_root="$GITHUB_WORKSPACE/source"
          ios_dir="$project_root/pip_swift"

          test -f "$project_root/scripts/select_xcode_26.sh"
          test -f "$project_root/scripts/verify_project.sh"
          test -f "$project_root/scripts/build_unsigned_ipa.sh"
          chmod +x "$project_root/scripts/"*.sh

          test -f "$ios_dir/Podfile.lock"
          test -f "$ios_dir/Pods/Manifest.lock"
          cmp -s "$ios_dir/Podfile.lock" "$ios_dir/Pods/Manifest.lock"
          grep -q 'MARKETING_VERSION = 2.3.1' "$ios_dir/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'CURRENT_PROJECT_VERSION = 2026090906' "$ios_dir/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'PRODUCT_NAME = Speed' "$ios_dir/pip_swift.xcodeproj/project.pbxproj"

          echo "PROJECT_ROOT=$project_root" >> "$GITHUB_ENV"
          echo "IOS_DIR=$ios_dir" >> "$GITHUB_ENV"

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Verify Laboratory source
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"

          ipa="$GITHUB_WORKSPACE/out/Speed-2.3.1-Laboratory-2-unsigned.ipa"
          source_archive="$GITHUB_WORKSPACE/out/Speed-2.3.1-Laboratory-2-Source.tar.gz"

          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          unzip -t "$ipa"
          shasum -a 256 "$ipa" > "$ipa.sha256"

          tar -czf "$source_archive" -C "$PROJECT_ROOT" .
          shasum -a 256 "$source_archive" > "$source_archive.sha256"

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Speed-2.3.1-Laboratory-2-Xcode-Diagnostics
          path: |
            ${{ env.PROJECT_ROOT }}/build/diagnostics/xcodebuild.log
            ${{ env.PROJECT_ROOT }}/build/diagnostics/Speed.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unsigned IPA and source
        uses: actions/upload-artifact@v4
        with:
          name: Speed-2.3.1-Laboratory-2
          path: |
            out/Speed-2.3.1-Laboratory-2-unsigned.ipa
            out/Speed-2.3.1-Laboratory-2-unsigned.ipa.sha256
            out/Speed-2.3.1-Laboratory-2-Source.tar.gz
            out/Speed-2.3.1-Laboratory-2-Source.tar.gz.sha256
          if-no-files-found: error

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-2.3.1-Laboratory-2-unsigned.ipa"
          source_archive="$GITHUB_WORKSPACE/out/Speed-2.3.1-Laboratory-2-Source.tar.gz"

          if gh release view dev-latest >/dev/null 2>&1; then
            gh release upload dev-latest "$ipa" "$source_archive" --clobber
            gh release edit dev-latest \
              --target "$GITHUB_SHA" \
              --title "Speed Laboratory Build" \
              --notes "Speed 2.3.1 Laboratory 2 runtime crash hotfix. UI unchanged. UIUpdateLink now attaches at UIWindowScene scope, rebuild is deferred one main-run-loop turn, and only enabled preferences are written. Unsigned IPA: sign before installation." \
              --prerelease
          else
            gh release create dev-latest "$ipa" "$source_archive" \
              --target "$GITHUB_SHA" \
              --title "Speed Laboratory Build" \
              --notes "Speed 2.3.1 Laboratory 2 runtime crash hotfix. UI unchanged. UIUpdateLink now attaches at UIWindowScene scope, rebuild is deferred one main-run-loop turn, and only enabled preferences are written. Unsigned IPA: sign before installation." \
              --prerelease
          fi
