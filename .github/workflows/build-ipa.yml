name: Build Speed 2.1.7 IPA

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Source variant to build
        required: true
        default: optimized
        type: choice
        options:
          - optimized
          - conservative_ab
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      VARIANT: ${{ github.event.inputs.variant || 'optimized' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Speed source archive
        shell: bash
        run: |
          set -euo pipefail
          case "$VARIANT" in
            optimized)
              archive_name='Speed-2.1.7-Source.tar.gz'
              artifact_name='Speed-2.1.7'
              ;;
            conservative_ab)
              archive_name='Speed-2.1.7-AB-BackgroundTask-Conservative-Source.tar.gz'
              artifact_name='Speed-2.1.7-AB-BackgroundTask-Conservative'
              ;;
            *)
              echo "Unknown variant: $VARIANT" >&2
              exit 2
              ;;
          esac

          archive="$GITHUB_WORKSPACE/$archive_name"
          test -f "$archive" || {
            echo "Missing $archive_name in repository root." >&2
            exit 2
          }

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE/source"

          workspace_data="$(find "$GITHUB_WORKSPACE/source" -type f -path '*/pip_swift/pip_swift.xcworkspace/contents.xcworkspacedata' -print -quit)"
          test -n "$workspace_data" || {
            echo 'The source archive does not contain the Speed Xcode workspace.' >&2
            exit 2
          }

          ios_dir="$(dirname "$(dirname "$workspace_data")")"
          project_root="$(dirname "$ios_dir")"
          test -x "$project_root/scripts/select_xcode_26.sh"
          test -x "$project_root/scripts/verify_project.sh"
          test -x "$project_root/scripts/build_unsigned_ipa.sh"
          test -f "$ios_dir/Podfile.lock"
          test -f "$ios_dir/Pods/Manifest.lock"
          cmp -s "$ios_dir/Podfile.lock" "$ios_dir/Pods/Manifest.lock"
          grep -q 'MARKETING_VERSION = 2.1.7' "$ios_dir/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'PRODUCT_NAME = Speed' "$ios_dir/pip_swift.xcodeproj/project.pbxproj"

          echo "PROJECT_ROOT=$project_root" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"

      - name: Select Xcode with iPhoneOS 26 SDK
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Verify Speed source
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned Speed IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Prepare named IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$GITHUB_WORKSPACE/out/$ARTIFACT_NAME-unsigned.ipa"
          unzip -t "$GITHUB_WORKSPACE/out/$ARTIFACT_NAME-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/out/$ARTIFACT_NAME-unsigned.ipa" > "$GITHUB_WORKSPACE/out/$ARTIFACT_NAME-unsigned.ipa.sha256"

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Speed-2.1.7-Xcode-Diagnostics-${{ env.VARIANT }}
          path: |
            ${{ env.PROJECT_ROOT }}/build/diagnostics/xcodebuild.log
            ${{ env.PROJECT_ROOT }}/build/diagnostics/Speed.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-IPA
          path: |
            out/${{ env.ARTIFACT_NAME }}-unsigned.ipa
            out/${{ env.ARTIFACT_NAME }}-unsigned.ipa.sha256
          if-no-files-found: error
