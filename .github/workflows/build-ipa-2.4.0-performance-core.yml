name: Build Speed 2.4.0 Performance Core IPA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa-2.4.0-performance-core.yml'
      - 'patches/speed-2.4.0-performance-core-final.part00'
      - 'patches/speed-2.4.0-performance-core-final.part01'
      - 'patches/speed-2.4.0-performance-core-final.part02'
      - 'patches/speed-2.4.0-performance-core-final.part03'
      - 'patches/speed-2.4.0-performance-core-final.part04'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASELINE_SOURCE: Speed-2.3.8-Live-Resize-Source.tar.gz
  PATCH_SHA256: 5c8812d41551dc0c1c4e90ccc57f699bd2f7b641f688fd37606bd3e8e8ba5a83

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Speed 2.3.8 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/source"
          gh release download dev-latest \
            --pattern "$BASELINE_SOURCE" \
            --dir "$GITHUB_WORKSPACE/baseline"
          tar -xzf "$GITHUB_WORKSPACE/baseline/$BASELINE_SOURCE" \
            -C "$GITHUB_WORKSPACE/source"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Assemble and apply Speed 2.4.0 patch
        shell: bash
        run: |
          set -euo pipefail
          parts="$GITHUB_WORKSPACE/patches/speed-2.4.0-performance-core-final.part"
          cat "${parts}00" "${parts}01" "${parts}02" "${parts}03" "${parts}04" > "$RUNNER_TEMP/speed-2.4.0.patch.gz.b64"
          python3 - <<'PY'
          import base64, gzip, pathlib
          src = pathlib.Path("/Users/runner/work/_temp/speed-2.4.0.patch.gz.b64")
          if not src.exists():
              import os
              src = pathlib.Path(os.environ["RUNNER_TEMP"]) / "speed-2.4.0.patch.gz.b64"
          raw = base64.b64decode(src.read_bytes())
          out = src.with_name("speed-2.4.0.patch")
          out.write_bytes(gzip.decompress(raw))
          print(out)
          PY
          patch_file="$RUNNER_TEMP/speed-2.4.0.patch"
          actual_patch_sha="$(shasum -a 256 "$patch_file" | awk '{print $1}')"
          echo "Patch SHA-256: $actual_patch_sha"
          test "$actual_patch_sha" = "$PATCH_SHA256"

          cd "$PROJECT_ROOT"
          patch --dry-run -p1 < "$patch_file"
          patch -p1 < "$patch_file"

          # The code-only patch deliberately excludes bulky delete records; remove them explicitly.
          rm -rf "$PROJECT_ROOT/pip_swift/Pods"
          rm -f "$PROJECT_ROOT/pip_swift/podfile" "$PROJECT_ROOT/pip_swift/Podfile.lock"
          rm -rf "$PROJECT_ROOT/pip_swift/pip_swift.xcworkspace"
          rm -f "$PROJECT_ROOT/pip_swift/pip_swift/AppDesignSystem.swift"
          rm -f "$PROJECT_ROOT/pip_swift/pip_swift/Base.lproj/Main.storyboard"
          rm -rf "$PROJECT_ROOT/build" "$PROJECT_ROOT/dist"

          grep -q 'MARKETING_VERSION = 2.4.0' "$PROJECT_ROOT/pip_swift/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'CURRENT_PROJECT_VERSION = 2026091001' "$PROJECT_ROOT/pip_swift/pip_swift.xcodeproj/project.pbxproj"
          test ! -e "$PROJECT_ROOT/pip_swift/Pods"
          test ! -e "$PROJECT_ROOT/pip_swift/pip_swift.xcworkspace"
          ! grep -R -n -E 'import[[:space:]]+SnapKit|SnapKit.framework' "$PROJECT_ROOT/pip_swift/pip_swift" "$PROJECT_ROOT/pip_swift/pip_swift.xcodeproj/project.pbxproj"

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Verify optimized project
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Validate and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-2.4.0-Performance-Core-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.4.0-Performance-Core-Source.tar.gz"

          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          unzip -t "$ipa"

          raw_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.mov$' | wc -l | tr -d ' ')"
          compact_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.spm$' | wc -l | tr -d ' ')"
          test "$raw_count" -eq 3
          test "$compact_count" -eq 217
          if unzip -l "$ipa" | grep -qi 'SnapKit'; then
            echo 'Unexpected SnapKit payload in final IPA' >&2
            exit 1
          fi

          python3 - "$ipa" <<'PY'
          import plistlib, sys, zipfile
          ipa = sys.argv[1]
          with zipfile.ZipFile(ipa) as z:
              plist_name = next(n for n in z.namelist() if n.endswith('/Info.plist') and n.startswith('Payload/'))
              p = plistlib.loads(z.read(plist_name))
          assert p['CFBundleShortVersionString'] == '2.4.0', p.get('CFBundleShortVersionString')
          assert p['CFBundleVersion'] == '2026091001', p.get('CFBundleVersion')
          print('Validated version:', p['CFBundleShortVersionString'], 'build', p['CFBundleVersion'])
          PY

          echo "Final IPA bytes: $(stat -f%z "$ipa")"
          shasum -a 256 "$ipa" > "$ipa.sha256"

          tar \
            --exclude='./build' \
            --exclude='./dist' \
            -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-2.4.0-Performance-Core
          path: |
            out/Speed-2.4.0-Performance-Core-unsigned.ipa
            out/Speed-2.4.0-Performance-Core-unsigned.ipa.sha256
            out/Speed-2.4.0-Performance-Core-Source.tar.gz
            out/Speed-2.4.0-Performance-Core-Source.tar.gz.sha256
          if-no-files-found: error

      - name: Publish rolling prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-2.4.0-Performance-Core-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.4.0-Performance-Core-Source.tar.gz"

          gh release upload dev-latest "$ipa" "$src" --clobber
          gh release edit dev-latest \
            --target "$GITHUB_SHA" \
            --title "Speed 2.4.0 Performance Core" \
            --notes "Performance-core rebuild for iOS 26+. Compatibility resizing now uses directional predictive prefetch, newest-generation-only application, same-height materialization coalescing, lower-copy compact decoding, cached AVURLAssets, a 60 Hz preview ceiling, and an in-memory generated-media LRU with no cache-hit metadata writes. Local playback disables network-oriented startup waiting, display-context lookup is cached per UIWindowScene, SnapKit/CocoaPods and obsolete pre-iOS-26 branches are removed, and Release cannot trigger the heavy runtime H.264 fallback. The proven Standard 120 Hz CADisplayLink route and existing Speed UI remain unchanged. Unsigned IPA: sign before installation." \
            --prerelease
