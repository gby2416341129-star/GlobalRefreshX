name: Build Speed 2.3.7 Compact Compatibility IPA v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa-2.3.7-compact-compat-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare exact 2.3.6 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/base" "$GITHUB_WORKSPACE/src"
          gh run download 34309086303 --name Speed-2.3.6-Compatibility-Response --dir "$GITHUB_WORKSPACE/base"
          tar -xzf "$GITHUB_WORKSPACE/base/Speed-2.3.6-Compatibility-Response-Source.tar.gz" -C "$GITHUB_WORKSPACE/src"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"

      - name: Reassemble and apply verified 2.3.7 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE/patches/speed237chunks" "$RUNNER_TEMP/speed237.patch" <<'PY'
          import base64, gzip, hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          files = [root / f"chunk{i:02d}" for i in range(8)]
          encoded = b"".join(p.read_bytes() for p in files)
          encoded = b"".join(encoded.split())
          assert len(encoded) == 6400, len(encoded)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = "1c01fe36c517841f293a88499cfd03cf6563fa092ac84b1a943ba85ba0a43266"
          actual = hashlib.sha256(patch).hexdigest()
          assert actual == expected, (actual, expected)
          pathlib.Path(sys.argv[2]).write_bytes(patch)
          print("patch_sha256=" + actual)
          PY
          cd "$PROJECT_ROOT"
          patch --dry-run -p1 < "$RUNNER_TEMP/speed237.patch"
          patch -p1 < "$RUNNER_TEMP/speed237.patch"
          rm -rf build dist
          grep -q 'MARKETING_VERSION = 2.3.7' pip_swift/pip_swift.xcodeproj/project.pbxproj
          grep -q 'CURRENT_PROJECT_VERSION = 2026090912' pip_swift/pip_swift.xcodeproj/project.pbxproj
          grep -q 'compression_decode_buffer' pip_swift/pip_swift/ViewController.swift

      - name: Build and verify compact exact-media archive
        shell: bash
        run: |
          set -euo pipefail
          media="$PROJECT_ROOT/pip_swift/pip_swift/CompatibilityMedia"
          test "$(find "$media" -type f -name 'h*.mov' | wc -l | tr -d ' ')" -eq 220
          python3 - "$media" <<'PY'
          import pathlib, struct, sys, zlib
          d = pathlib.Path(sys.argv[1])
          clips = [(d / f"h{h:03d}.mov").read_bytes() for h in range(1,221)]
          assert all(clips)
          raw = b"".join(struct.pack("<I", len(c)) for c in clips) + b"".join(clips)
          packed = b"SPDCPK01" + struct.pack("<Q", len(raw)) + zlib.compress(raw, 9)
          out = d / "compatibility-media-v1.pack"
          out.write_bytes(packed)
          blob = out.read_bytes()
          assert blob[:8] == b"SPDCPK01"
          n = struct.unpack("<Q", blob[8:16])[0]
          inflated = zlib.decompress(blob[16:])
          assert n == len(raw) == len(inflated)
          sizes = [struct.unpack_from("<I", inflated, i*4)[0] for i in range(220)]
          pos = 220*4
          for c, size in zip(clips, sizes):
              assert inflated[pos:pos+size] == c
              pos += size
          assert pos == len(inflated)
          assert len(blob) < 400000, len(blob)
          keep = {"h001.mov","h022.mov","h120.mov"}
          for p in d.glob("h*.mov"):
              if p.name not in keep: p.unlink()
          assert {p.name for p in d.glob("h*.mov")} == keep
          print(f"pack={len(blob)} raw={len(raw)}")
          PY

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          "$PROJECT_ROOT/scripts/select_xcode_26.sh"
          "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Validate and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-2.3.7-Compact-Compatibility-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.3.7-Compact-Compatibility-Source.tar.gz"
          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          unzip -t "$ipa"
          test "$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.mov$' | wc -l | tr -d ' ')" -eq 3
          unzip -l "$ipa" | grep -q 'Payload/Speed.app/CompatibilityMedia/compatibility-media-v1.pack'
          app_bytes="$(unzip -l "$ipa" | awk '/Payload\/Speed.app\// {s += $1} END {print s+0}')"
          ipa_bytes="$(stat -f%z "$ipa")"
          echo "ipa_bytes=$ipa_bytes"
          echo "uncompressed_app_bytes=$app_bytes"
          test "$app_bytes" -lt 4000000
          shasum -a 256 "$ipa" > "$ipa.sha256"
          tar --exclude='./build' --exclude='./dist' -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-2.3.7-Compact-Compatibility
          path: |
            out/Speed-2.3.7-Compact-Compatibility-unsigned.ipa
            out/Speed-2.3.7-Compact-Compatibility-unsigned.ipa.sha256
            out/Speed-2.3.7-Compact-Compatibility-Source.tar.gz
            out/Speed-2.3.7-Compact-Compatibility-Source.tar.gz.sha256
          if-no-files-found: error
