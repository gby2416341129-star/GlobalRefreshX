name: Inspect Speed 2.5 for 2.6

on:
  push:
    branches: [speed-2.6-dev]
    paths:
      - '.github/workflows/inspect-speed-2.5-for-2.6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: speed-2.6-dev

      - name: Download and extract Speed 2.5.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/speed250" "$RUNNER_TEMP/source"
          mkdir -p "$RUNNER_TEMP/speed250" "$RUNNER_TEMP/source"
          gh release download dev-latest --pattern 'Speed-2.5.0-All-Features-Source.tar.gz' --dir "$RUNNER_TEMP/speed250"
          tar -xzf "$RUNNER_TEMP/speed250/Speed-2.5.0-All-Features-Source.tar.gz" -C "$RUNNER_TEMP/source"

      - name: Snapshot core Swift and build scripts
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/source"
          dst="$GITHUB_WORKSPACE/inspection/speed-2.5-core"
          rm -rf "$dst"
          mkdir -p "$dst/app" "$dst/scripts"
          find "$src/pip_swift/pip_swift" -maxdepth 1 -type f -name '*.swift' -print0 | sort -z | while IFS= read -r -d '' f; do
            cp "$f" "$dst/app/$(basename "$f")"
          done
          for f in verify_project.sh build_unsigned_ipa.sh select_xcode_26.sh; do
            test -f "$src/scripts/$f" && cp "$src/scripts/$f" "$dst/scripts/$f"
          done
          find "$dst" -type f | sort > "$dst/MANIFEST.txt"

      - name: Commit snapshot to dev branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection/speed-2.5-core
          if git diff --cached --quiet; then
            echo 'No snapshot changes.'
            exit 0
          fi
          git commit -m 'Snapshot Speed 2.5 core for 2.6 development'
          git push origin HEAD:speed-2.6-dev
