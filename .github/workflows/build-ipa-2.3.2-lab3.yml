name: Build Speed 2.3.2 Laboratory 3 IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct Speed 2.3.2 Laboratory 3 source
        shell: bash
        run: |
          set -euo pipefail

          base_archive="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f \
            \( -name 'Speed-2.2.0-Final-Candidate-1-Source.tar.gz' \
               -o -name 'Speed-2.2.0-Final-Candidate-1-Source.tar.gz*' \
               -o -iname '*Speed*2.2.0*Final*Candidate*1*Source*.tar.gz*' \) \
            -print -quit)"
          lab_payload="$RUNNER_TEMP/speed-2.3.0-lab1.patch.gz.b64"
          lab_patch="$RUNNER_TEMP/speed-2.3.0-lab1.patch"

          test -n "$base_archive"
          cat \
            "$GITHUB_WORKSPACE/payload/speed-2.3.0-lab1.b64.part-00" \
            "$GITHUB_WORKSPACE/payload/speed-2.3.0-lab1.b64.part-01" \
            "$GITHUB_WORKSPACE/payload/speed-2.3.0-lab1.b64.part-02" \
            "$GITHUB_WORKSPACE/payload/speed-2.3.0-lab1.b64.part-03" \
            > "$lab_payload"

          test "$(wc -c < "$lab_payload" | tr -d ' ')" -eq 11652
          echo "d99838dd1c0891c74587e3c590a68081fec3cbdbf032e67472c8bcfa5de3a279  $lab_payload" | shasum -a 256 -c -

          python3 - "$lab_payload" "$lab_patch" <<'PYCODE'
          import base64, gzip, pathlib, sys
          payload = pathlib.Path(sys.argv[1]).read_text().strip()
          pathlib.Path(sys.argv[2]).write_bytes(gzip.decompress(base64.b64decode(payload, validate=True)))
          PYCODE

          echo "f98f649da4645157c0da9b282385b97c29a7dbc75b19ab6ae7a3b486304d0b55  $lab_patch" | shasum -a 256 -c -

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"
          tar -xzf "$base_archive" -C "$GITHUB_WORKSPACE/source"
          patch -d "$GITHUB_WORKSPACE/source" -p1 < "$lab_patch"

          python3 - "$GITHUB_WORKSPACE/source" <<'PYHOTFIX'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          refresh = root / "pip_swift/pip_swift/RefreshRateController.swift"
          s = refresh.read_text()
          start = s.index("@MainActor\nfinal class LatencyExperimentController")
          brace = s.index("{", start)
          depth = 0
          end = None
          for i, ch in enumerate(s[brace:], start=brace):
              if ch == "{": depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise RuntimeError("LatencyExperimentController end not found")

          replacement = r'''@MainActor
          final class LatencyExperimentController {
              static let shared = LatencyExperimentController()

              private weak var anchorView: UIView?
              private var preferenceLink: UIUpdateLink?
              private var continuousLink: UIUpdateLink?
              private var rebuildGeneration: UInt = 0
              private(set) var state = LatencyExperimentState()

              private init() {}

              func attach(to view: UIView) {
                  anchorView = view
                  if state.anyPreferenceEnabled { scheduleRebuild() }
              }

              func setLowLatencyEventDispatchEnabled(_ enabled: Bool) {
                  guard state.lowLatencyEventDispatchEnabled != enabled else { return }
                  state.lowLatencyEventDispatchEnabled = enabled
                  scheduleRebuild()
              }

              func setImmediatePresentationEnabled(_ enabled: Bool) {
                  guard state.immediatePresentationEnabled != enabled else { return }
                  state.immediatePresentationEnabled = enabled
                  scheduleRebuild()
              }

              func setContinuousUpdatesEnabled(_ enabled: Bool) {
                  guard state.continuousUpdatesEnabled != enabled else { return }
                  state.continuousUpdatesEnabled = enabled
                  scheduleRebuild()
              }

              func setAllEnabled(_ enabled: Bool) {
                  state.lowLatencyEventDispatchEnabled = enabled
                  state.immediatePresentationEnabled = enabled
                  state.continuousUpdatesEnabled = enabled
                  scheduleRebuild()
              }

              func reconcile() {
                  guard state.anyPreferenceEnabled else {
                      stopLinks()
                      return
                  }
                  let preferenceNeeded = state.lowLatencyEventDispatchEnabled || state.immediatePresentationEnabled
                  let preferenceOK = !preferenceNeeded || preferenceLink?.isEnabled == true
                  let continuousOK = !state.continuousUpdatesEnabled || continuousLink?.isEnabled == true
                  if !preferenceOK || !continuousOK { scheduleRebuild() }
              }

              func stopForTeardown() {
                  rebuildGeneration &+= 1
                  stopLinks()
                  anchorView = nil
                  state = LatencyExperimentState()
              }

              private func scheduleRebuild() {
                  rebuildGeneration &+= 1
                  let generation = rebuildGeneration
                  DispatchQueue.main.async { [weak self] in
                      guard let self, generation == self.rebuildGeneration else { return }
                      self.rebuildLinks()
                  }
              }

              private func rebuildLinks() {
                  stopLinks(resetPreferences: false)
                  guard state.anyPreferenceEnabled, let anchorView, let windowScene = anchorView.window?.windowScene else {
                      state.updateLinkActive = false
                      return
                  }

                  if state.lowLatencyEventDispatchEnabled || state.immediatePresentationEnabled {
                      let link = UIUpdateLink(windowScene: windowScene)
                      if state.lowLatencyEventDispatchEnabled { link.wantsLowLatencyEventDispatch = true }
                      if state.immediatePresentationEnabled { link.wantsImmediatePresentation = true }
                      link.isEnabled = true
                      preferenceLink = link
                  }

                  if state.continuousUpdatesEnabled {
                      let link = UIUpdateLink(view: anchorView, actionHandler: { _, _ in
                          // Intentionally empty. The continuous link itself is the experiment.
                          // Speed's existing stable CADisplayLink remains responsible for the 120 Hz preference.
                      })
                      link.requiresContinuousUpdates = true
                      link.isEnabled = true
                      continuousLink = link
                  }

                  state.updateLinkActive = (preferenceLink?.isEnabled == true) || (continuousLink?.isEnabled == true)
                  AppDebugLogger.log(
                      "Laboratory links active: lowLatency=\(state.lowLatencyEventDispatchEnabled), "
                      + "immediate=\(state.immediatePresentationEnabled), continuous=\(state.continuousUpdatesEnabled)"
                  )
              }

              private func stopLinks(resetPreferences: Bool = false) {
                  preferenceLink?.isEnabled = false
                  preferenceLink = nil
                  continuousLink?.isEnabled = false
                  continuousLink = nil
                  state.updateLinkActive = false
                  if resetPreferences { state = LatencyExperimentState() }
              }
          }'''
          s = s[:start] + replacement + s[end:]
          refresh.write_text(s)

          project = root / "pip_swift/pip_swift.xcodeproj/project.pbxproj"
          p = project.read_text()
          p = p.replace("MARKETING_VERSION = 2.3.0;", "MARKETING_VERSION = 2.3.2;")
          p = p.replace("CURRENT_PROJECT_VERSION = 2026090905;", "CURRENT_PROJECT_VERSION = 2026090907;")
          project.write_text(p)
          PYHOTFIX

          project_root="$GITHUB_WORKSPACE/source"
          ios_dir="$project_root/pip_swift"
          refresh="$ios_dir/pip_swift/RefreshRateController.swift"

          chmod +x "$project_root/scripts/"*.sh
          test -f "$ios_dir/Podfile.lock"
          test -f "$ios_dir/Pods/Manifest.lock"
          cmp -s "$ios_dir/Podfile.lock" "$ios_dir/Pods/Manifest.lock"
          grep -q 'MARKETING_VERSION = 2.3.2' "$ios_dir/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'CURRENT_PROJECT_VERSION = 2026090907' "$ios_dir/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'PRODUCT_NAME = Speed' "$ios_dir/pip_swift.xcodeproj/project.pbxproj"
          grep -q 'UIUpdateLink(windowScene: windowScene)' "$refresh"
          grep -q 'UIUpdateLink(view: anchorView, actionHandler:' "$refresh"
          grep -q 'requiresContinuousUpdates = true' "$refresh"
          if grep -A140 'final class LatencyExperimentController' "$refresh" | grep -q 'preferredFrameRateRange'; then
            echo 'ERROR: Laboratory continuous path must not write UIUpdateLink preferredFrameRateRange in Lab 3.' >&2
            exit 3
          fi

          echo "PROJECT_ROOT=$project_root" >> "$GITHUB_ENV"

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-2.3.2-Laboratory-3-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.3.2-Laboratory-3-Source.tar.gz"
          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          unzip -t "$ipa"
          shasum -a 256 "$ipa" > "$ipa.sha256"
          tar -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-2.3.2-Laboratory-3
          path: |
            out/Speed-2.3.2-Laboratory-3-unsigned.ipa
            out/Speed-2.3.2-Laboratory-3-unsigned.ipa.sha256
            out/Speed-2.3.2-Laboratory-3-Source.tar.gz
            out/Speed-2.3.2-Laboratory-3-Source.tar.gz.sha256
          if-no-files-found: error

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-2.3.2-Laboratory-3-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.3.2-Laboratory-3-Source.tar.gz"
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release upload dev-latest "$ipa" "$src" --clobber
            gh release edit dev-latest --target "$GITHUB_SHA" --title "Speed Laboratory Build" --notes "Speed 2.3.2 Laboratory 3. UI unchanged. Fixes continuous UI update crash by isolating continuous updates on a view-bound UIUpdateLink with an action handler and leaving 120 Hz preference to Speed's stable CADisplayLink path." --prerelease
          else
            gh release create dev-latest "$ipa" "$src" --target "$GITHUB_SHA" --title "Speed Laboratory Build" --notes "Speed 2.3.2 Laboratory 3. UI unchanged. Fixes continuous UI update crash by isolating continuous updates on a view-bound UIUpdateLink with an action handler and leaving 120 Hz preference to Speed's stable CADisplayLink path." --prerelease
          fi
