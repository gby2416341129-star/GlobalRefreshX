name: Build Speed 3.0.9 PlayerLayer + Telemetry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa-3.0.9-playerlayer-telemetry.yml'
      - 'patches/speed309-playerlayer-telemetry.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Speed 3.0.8 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/source"
          gh release download dev-latest --pattern 'Speed-3.0.8-Telemetry-Compatibility-Smooth-Source.tar.gz' --dir "$GITHUB_WORKSPACE/baseline"
          baseline="$GITHUB_WORKSPACE/baseline/Speed-3.0.8-Telemetry-Compatibility-Smooth-Source.tar.gz"
          tar -xzf "$baseline" -C "$GITHUB_WORKSPACE/source"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Apply Speed 3.0.9 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -D < "$GITHUB_WORKSPACE/patches/speed309-playerlayer-telemetry.b64" | gunzip > "$RUNNER_TEMP/speed309.patch"
          test "$(shasum -a 256 "$RUNNER_TEMP/speed309.patch" | awk '{print $1}')" = "1d8b6d7e56c4082aec42fc57b3914a457c5498f8b4351ab30c3d6c9fe6cbd956"
          cd "$PROJECT_ROOT"
          patch --dry-run -p1 < "$RUNNER_TEMP/speed309.patch"
          patch -p1 < "$RUNNER_TEMP/speed309.patch"
          find pip_swift/pip_swift -name '*.orig' -delete
          rm -rf build dist

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Parse modified Swift sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          for file in \
            pip_swift/pip_swift/ViewController.swift \
            pip_swift/pip_swift/PiPViews.swift \
            pip_swift/pip_swift/HomePresentationState.swift \
            pip_swift/pip_swift/AppDebugLogger.swift; do
            xcrun swiftc -frontend -parse "$file"
          done

      - name: Execute core regressions
        shell: bash
        run: "$PROJECT_ROOT/scripts/test_core.sh"

      - name: Verify integrated project
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Require warning-clean Swift compilation
        shell: bash
        run: |
          set -euo pipefail
          log="$PROJECT_ROOT/build/diagnostics/xcodebuild.log"
          test -f "$log"
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' "$log"; then
            echo 'Swift source warnings are not allowed in Speed 3.0.9.' >&2
            exit 1
          fi

      - name: Validate actual Speed 3.0.9 IPA
        shell: bash
        run: python3 "$PROJECT_ROOT/scripts/validate_ipa.py" "$PROJECT_ROOT/dist/Speed-unsigned.ipa"

      - name: Package release outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-3.0.9-PlayerLayer-Telemetry-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-3.0.9-PlayerLayer-Telemetry-Source.tar.gz"
          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          shasum -a 256 "$ipa" > "$ipa.sha256"
          tar --exclude='./build' --exclude='./dist' -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-3.0.9-PlayerLayer-Telemetry
          path: |
            out/Speed-3.0.9-PlayerLayer-Telemetry-unsigned.ipa
            out/Speed-3.0.9-PlayerLayer-Telemetry-unsigned.ipa.sha256
            out/Speed-3.0.9-PlayerLayer-Telemetry-Source.tar.gz
            out/Speed-3.0.9-PlayerLayer-Telemetry-Source.tar.gz.sha256
            source/build/diagnostics/xcodebuild.log
          if-no-files-found: error

      - name: Publish rolling prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-3.0.9-PlayerLayer-Telemetry-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-3.0.9-PlayerLayer-Telemetry-Source.tar.gz"
          gh release upload dev-latest "$ipa" "$src" --clobber
          gh release edit dev-latest --target "$GITHUB_SHA" --title "Speed 3.0.9 PlayerLayer + Telemetry" --notes "Data-guided four-mode build. Auto and Compatibility 3.0.8 refresh cores are preserved. Manual Compatibility is explicit VideoCall + VideoCall geometry + CAD-only 120Hz; PlayerLayer is restored as its own real AVPlayerLayer + PlayerLayer geometry + the same CAD-only 120Hz policy for controlled A/B testing. Flight Recorder 1.3 exports user mode, actual backend, geometry route and refresh policy, separates foreground/background CPU summaries, and captures an immediate resource sample when a hitch is marked. Unsigned IPA: sign before installation." --prerelease
