name: Build Speed 3.0.0 Adaptive Engine

on:
  push:
    branches: [speed-2.6-dev]
    paths:
      - '.github/workflows/build-ipa-3.0.0-adaptive-engine.yml'
      - 'scripts/speed300/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASELINE_SOURCE: Speed-2.6.7-Lab-Crash-Recovery-Source.tar.gz
  PATCH_SHA256: bed2ab70a339c18d1ec4ff133b383f9a73f7d32dd078c4faeee7324e2fc72a57

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out Speed development
        uses: actions/checkout@v4
        with:
          ref: speed-2.6-dev

      - name: Download Speed 2.6.7 last-known-good source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/source"
          gh release download dev-latest --pattern "$BASELINE_SOURCE" --dir "$GITHUB_WORKSPACE/baseline"
          tar -xzf "$GITHUB_WORKSPACE/baseline/$BASELINE_SOURCE" -C "$GITHUB_WORKSPACE/source"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Apply Speed 3.0.0 Adaptive Engine
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/scripts/speed300/part*.b64 | base64 -D | gunzip > "$RUNNER_TEMP/speed300.patch"
          actual="$(shasum -a 256 "$RUNNER_TEMP/speed300.patch" | awk '{print $1}')"
          test "$actual" = "$PATCH_SHA256"
          cd "$PROJECT_ROOT"
          patch --dry-run -p1 < "$RUNNER_TEMP/speed300.patch"
          patch -p1 < "$RUNNER_TEMP/speed300.patch"
          rm -rf "$PROJECT_ROOT/build" "$PROJECT_ROOT/dist"

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Verify integration
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Require warning-clean Swift build
        shell: bash
        run: |
          set -euo pipefail
          log="$PROJECT_ROOT/build/diagnostics/xcodebuild.log"
          test -f "$log"
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' "$log"; then
            echo 'Swift warnings are not allowed in Speed 3.0.0.' >&2
            exit 1
          fi

      - name: Validate and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-3.0.0-Adaptive-Engine-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-3.0.0-Adaptive-Engine-Source.tar.gz"
          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          unzip -t "$ipa"
          unzip -l "$ipa" | grep -q 'Payload/Speed.app/PlugIns/SpeedControls.appex/SpeedControls$'
          raw_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.mov$' | wc -l | tr -d ' ')"
          compact_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.spm$' | wc -l | tr -d ' ')"
          test "$raw_count" -eq 3
          test "$compact_count" -eq 217
          python3 -c "import plistlib,zipfile; z=zipfile.ZipFile('$ipa'); a=plistlib.loads(z.read('Payload/Speed.app/Info.plist')); e=plistlib.loads(z.read('Payload/Speed.app/PlugIns/SpeedControls.appex/Info.plist')); assert a['CFBundleShortVersionString']=='3.0.0' and a['CFBundleVersion']=='2026091104'; assert e['CFBundleShortVersionString']=='3.0.0' and e['CFBundleVersion']=='2026091104'; print('Validated Speed 3.0.0 app + extension')"
          shasum -a 256 "$ipa" > "$ipa.sha256"
          tar --exclude='./build' --exclude='./dist' -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-3.0.0-Adaptive-Engine
          path: |
            out/Speed-3.0.0-Adaptive-Engine-unsigned.ipa
            out/Speed-3.0.0-Adaptive-Engine-unsigned.ipa.sha256
            out/Speed-3.0.0-Adaptive-Engine-Source.tar.gz
            out/Speed-3.0.0-Adaptive-Engine-Source.tar.gz.sha256
          if-no-files-found: error

      - name: Publish Speed 3.0.0 test assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-3.0.0-Adaptive-Engine-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-3.0.0-Adaptive-Engine-Source.tar.gz"
          gh release upload dev-latest "$ipa" "$src" --clobber
          gh release edit dev-latest \
            --target "$GITHUB_SHA" \
            --title 'Speed 3.0.0 Adaptive Engine' \
            --notes 'Speed 3.0 starts the adaptive-engine architecture on the 2.6.7 last-known-good base. Adds Adaptive/Stable/Max Smoothness/Gaming profiles, device-local CADisplayLink/UIUpdateLink/Hybrid calibration, Crash Shield 3.0 for risky driver sessions, a bounded Cadence Recovery state machine with profile-specific thresholds, foreground-safe calibration cancellation, and a new Adaptive Engine card plus Driver Calibration UI. Laboratory remains fully open and manual changes enter Custom profile. Auto mode never claims to measure other apps FPS; calibration scores only Speed own cadence stability. Preserves 2.6.7 visible-view-bound UIUpdateLink architecture, one-tap hide fixes, PiP conflict notification/recovery state, and compact 3 MOV + 217 SPM compatibility media.' \
            --prerelease
