name: Build Speed 2.6.5 One-Tap Hide Fix

on:
  push:
    branches: [speed-2.6-dev]
    paths:
      - '.github/workflows/build-ipa-2.6.5-one-tap-hide-fix.yml'
      - 'scripts/speed265.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASELINE_SOURCE: Speed-2.6.4-Side-Stash-PiP-Conflict-Source.tar.gz
  PATCH_SHA256: 47f5e7b5f3255879d620b9943de6ae270d8e3961a6b5f9053e8e3eb3724ca9f8

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out Speed 2.6 development
        uses: actions/checkout@v4
        with:
          ref: speed-2.6-dev

      - name: Download Speed 2.6.4 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/source"
          gh release download dev-latest --pattern "$BASELINE_SOURCE" --dir "$GITHUB_WORKSPACE/baseline"
          tar -xzf "$GITHUB_WORKSPACE/baseline/$BASELINE_SOURCE" -C "$GITHUB_WORKSPACE/source"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Apply Speed 2.6.5 one-tap hide fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -D < "$GITHUB_WORKSPACE/scripts/speed265.patch.gz.b64" | gunzip > "$RUNNER_TEMP/speed265.patch"
          actual="$(shasum -a 256 "$RUNNER_TEMP/speed265.patch" | awk '{print $1}')"
          test "$actual" = "$PATCH_SHA256"
          cd "$PROJECT_ROOT"
          patch -p1 < "$RUNNER_TEMP/speed265.patch"
          rm -rf "$PROJECT_ROOT/build" "$PROJECT_ROOT/dist"

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Verify integration
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Require warning-clean Swift build
        shell: bash
        run: |
          set -euo pipefail
          log="$PROJECT_ROOT/build/diagnostics/xcodebuild.log"
          test -f "$log"
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' "$log"; then
            echo 'Swift warnings are not allowed in Speed 2.6.5.' >&2
            exit 1
          fi

      - name: Validate and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-2.6.5-One-Tap-Hide-Fix-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.6.5-One-Tap-Hide-Fix-Source.tar.gz"
          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          unzip -t "$ipa"
          unzip -l "$ipa" | grep -q 'Payload/Speed.app/PlugIns/SpeedControls.appex/SpeedControls$'
          raw_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.mov$' | wc -l | tr -d ' ')"
          compact_count="$(unzip -l "$ipa" | grep -E 'Payload/Speed.app/CompatibilityMedia/h[0-9]{3}\.spm$' | wc -l | tr -d ' ')"
          test "$raw_count" -eq 3
          test "$compact_count" -eq 217
          python3 -c "import plistlib,zipfile; z=zipfile.ZipFile('$ipa'); a=plistlib.loads(z.read('Payload/Speed.app/Info.plist')); e=plistlib.loads(z.read('Payload/Speed.app/PlugIns/SpeedControls.appex/Info.plist')); assert a['CFBundleShortVersionString']=='2.6.5' and a['CFBundleVersion']=='2026091101'; assert e['CFBundleShortVersionString']=='2.6.5' and e['CFBundleVersion']=='2026091101'; print('Validated Speed 2.6.5 app + extension')"
          shasum -a 256 "$ipa" > "$ipa.sha256"
          tar --exclude='./build' --exclude='./dist' -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-2.6.5-One-Tap-Hide-Fix
          path: |
            out/Speed-2.6.5-One-Tap-Hide-Fix-unsigned.ipa
            out/Speed-2.6.5-One-Tap-Hide-Fix-unsigned.ipa.sha256
            out/Speed-2.6.5-One-Tap-Hide-Fix-Source.tar.gz
            out/Speed-2.6.5-One-Tap-Hide-Fix-Source.tar.gz.sha256
          if-no-files-found: error

      - name: Publish Speed 2.6.5 test assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-2.6.5-One-Tap-Hide-Fix-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.6.5-One-Tap-Hide-Fix-Source.tar.gz"
          gh release upload dev-latest "$ipa" "$src" --clobber
          gh release edit dev-latest \
            --target "$GITHUB_SHA" \
            --title 'Speed 2.6.5 One-Tap Hide Fix' \
            --notes 'Removes the unreliable automatic side-stash calibration/replay experiment that could trap Hide and Start & Hide in a calibration loop on iOS 27. Restores immediate one-tap minimum hiding (0.1pt Standard / 1pt Compatibility), keeps transient height semantics, and adds a one-time Auto-Lock notice before Start & Hide with a recommended Start Only path for users who want to manually use iOS native side hiding. Keeps the 2.6.4 PiP-conflict notification and persisted 120Hz-paused recovery UI, the 2.6.3 core cleanup, stable CADisplayLink path, and compact 3 MOV + 217 SPM compatibility media.' \
            --prerelease
