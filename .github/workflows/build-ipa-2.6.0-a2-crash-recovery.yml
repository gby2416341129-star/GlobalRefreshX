name: Build Speed 2.6.0 A2 Crash Recovery

on:
  push:
    branches: [speed-2.6-dev]
    paths:
      - '.github/workflows/build-ipa-2.6.0-a2-crash-recovery.yml'
      - 'scripts/speed26a2_patch.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASELINE_SOURCE: Speed-2.5.0-All-Features-Source.tar.gz

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out Speed 2.6 development
        uses: actions/checkout@v4
        with:
          ref: speed-2.6-dev

      - name: Download Speed 2.5.0 final source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/source"
          gh release download dev-latest --pattern "$BASELINE_SOURCE" --dir "$GITHUB_WORKSPACE/baseline"
          tar -xzf "$GITHUB_WORKSPACE/baseline/$BASELINE_SOURCE" -C "$GITHUB_WORKSPACE/source"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Apply Speed 2.6 A2 crash recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/speed26a2_patch.py" "$PROJECT_ROOT"
          rm -rf "$PROJECT_ROOT/build" "$PROJECT_ROOT/dist"

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Verify integration
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Require warning-clean Swift build
        shell: bash
        run: |
          set -euo pipefail
          log="$PROJECT_ROOT/build/diagnostics/xcodebuild.log"
          test -f "$log"
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' "$log"; then
            echo 'Swift warnings are not allowed in Speed 2.6.0 A2.' >&2
            exit 1
          fi

      - name: Validate and package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-2.6.0-A2-Crash-Recovery-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.6.0-A2-Crash-Recovery-Source.tar.gz"
          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          unzip -t "$ipa"
          unzip -l "$ipa" | grep -q 'Payload/Speed.app/PlugIns/SpeedControls.appex/SpeedControls$'
          python3 -c "import plistlib,zipfile; z=zipfile.ZipFile('$ipa'); a=plistlib.loads(z.read('Payload/Speed.app/Info.plist')); e=plistlib.loads(z.read('Payload/Speed.app/PlugIns/SpeedControls.appex/Info.plist')); assert a['CFBundleShortVersionString']=='2.6.0' and a['CFBundleVersion']=='2026091004'; assert e['CFBundleShortVersionString']=='2.6.0' and e['CFBundleVersion']=='2026091004'; print('Validated Speed 2.6.0 A2 app + extension')"
          shasum -a 256 "$ipa" > "$ipa.sha256"
          tar --exclude='./build' --exclude='./dist' -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-2.6.0-A2-Crash-Recovery
          path: |
            out/Speed-2.6.0-A2-Crash-Recovery-unsigned.ipa
            out/Speed-2.6.0-A2-Crash-Recovery-unsigned.ipa.sha256
            out/Speed-2.6.0-A2-Crash-Recovery-Source.tar.gz
            out/Speed-2.6.0-A2-Crash-Recovery-Source.tar.gz.sha256
          if-no-files-found: error

      - name: Publish A2 test assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-2.6.0-A2-Crash-Recovery-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-2.6.0-A2-Crash-Recovery-Source.tar.gz"
          gh release upload dev-latest "$ipa" "$src" --clobber
          gh release edit dev-latest --target "$GITHUB_SHA" --title 'Speed 2.6.0 A2 Crash Recovery' --notes 'Fixes a crash loop triggered by Lab UIUpdateLink/Hybrid selection. Experimental refresh driver mode is now session-only, cold launch always restores CADisplayLink, and stale persisted driver values are cleared. A1 no-handler UIUpdateLink construction is reverted to the 2.5 action-handler form while preserving the 2.6 CADisplayLink cadence guard.' --prerelease
