name: Build Speed 3.0.6 Flight Recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa-3.0.6-flight-recorder.yml'
      - 'patches/speed306-flight-recorder.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Speed 3.0.5 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/source"
          gh release download dev-latest --pattern 'Speed-3.0.5-Compatibility-120Hz-Restore-Source.tar.gz' --dir "$GITHUB_WORKSPACE/baseline"
          baseline="$GITHUB_WORKSPACE/baseline/Speed-3.0.5-Compatibility-120Hz-Restore-Source.tar.gz"
          test "$(shasum -a 256 "$baseline" | awk '{print $1}')" = "ef79b4706b44b69e3996e9a3792db00a1ab0a895045306cabf6a980be4b2a970"
          tar -xzf "$baseline" -C "$GITHUB_WORKSPACE/source"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Apply Speed 3.0.6 Flight Recorder patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -D < "$GITHUB_WORKSPACE/patches/speed306-flight-recorder.b64" | gunzip > "$RUNNER_TEMP/speed306.patch"
          test "$(shasum -a 256 "$RUNNER_TEMP/speed306.patch" | awk '{print $1}')" = "11f87acf30530a9ee14bf47f221cc98c95d4c39daaf0faefee2e1259fc3e366c"
          cd "$PROJECT_ROOT"
          patch --dry-run -p1 < "$RUNNER_TEMP/speed306.patch"
          patch -p1 < "$RUNNER_TEMP/speed306.patch"
          rm -rf build dist

      - name: Select Xcode 26+
        shell: bash
        run: "$PROJECT_ROOT/scripts/select_xcode_26.sh"

      - name: Execute core regressions
        shell: bash
        run: "$PROJECT_ROOT/scripts/test_core.sh"

      - name: Verify integrated project
        shell: bash
        run: "$PROJECT_ROOT/scripts/verify_project.sh"

      - name: Build unsigned IPA
        shell: bash
        run: "$PROJECT_ROOT/scripts/build_unsigned_ipa.sh"

      - name: Require warning-clean Swift compilation
        shell: bash
        run: |
          set -euo pipefail
          log="$PROJECT_ROOT/build/diagnostics/xcodebuild.log"
          test -f "$log"
          if grep -E '\.swift:[0-9]+:[0-9]+: warning:' "$log"; then
            echo 'Swift source warnings are not allowed in Speed 3.0.6.' >&2
            exit 1
          fi

      - name: Validate actual Speed 3.0.6 IPA
        shell: bash
        run: python3 "$PROJECT_ROOT/scripts/validate_ipa.py" "$PROJECT_ROOT/dist/Speed-unsigned.ipa"

      - name: Package release outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          ipa="$GITHUB_WORKSPACE/out/Speed-3.0.6-Flight-Recorder-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-3.0.6-Flight-Recorder-Source.tar.gz"
          cp "$PROJECT_ROOT/dist/Speed-unsigned.ipa" "$ipa"
          shasum -a 256 "$ipa" > "$ipa.sha256"
          tar --exclude='./build' --exclude='./dist' -czf "$src" -C "$PROJECT_ROOT" .
          shasum -a 256 "$src" > "$src.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speed-3.0.6-Flight-Recorder
          path: |
            out/Speed-3.0.6-Flight-Recorder-unsigned.ipa
            out/Speed-3.0.6-Flight-Recorder-unsigned.ipa.sha256
            out/Speed-3.0.6-Flight-Recorder-Source.tar.gz
            out/Speed-3.0.6-Flight-Recorder-Source.tar.gz.sha256
            source/build/diagnostics/xcodebuild.log
          if-no-files-found: error

      - name: Publish rolling prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/out/Speed-3.0.6-Flight-Recorder-unsigned.ipa"
          src="$GITHUB_WORKSPACE/out/Speed-3.0.6-Flight-Recorder-Source.tar.gz"
          gh release upload dev-latest "$ipa" "$src" --clobber
          gh release edit dev-latest --target "$GITHUB_SHA" --title "Speed 3.0.6 Flight Recorder" --notes "Development instrumentation build based on Speed 3.0.5. Keeps the restored Standard and Compatibility 120Hz paths while adding an in-memory Flight Recorder for CADisplayLink frame timing, engine/PiP lifecycle, scene transitions, thermal and Low Power changes, user hitch markers, and one-tap .speeddiag.json export. Unsigned IPA: sign before installation." --prerelease
